<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Anuncio de torneo</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .court { width: 1300px; right: -420px; top: -40px; transform: rotate(180deg); opacity: .12; }
  .logo { top: 70px; left: 80px; width: 110px; }
  .top-tag { position: absolute; top: 96px; right: 80px; }
  .title { position: absolute; left: 76px; top: 300px; font-size: 230px; }
  .title small { display: block; font-size: 92px; letter-spacing: .02em; color: var(--arena); margin-bottom: 18px; }
  .ball { position: absolute; width: 360px; right: 70px; top: 330px; opacity: .9; }
  .ball circle, .ball path { fill: none; stroke: var(--naranja); stroke-width: 5; }
  .band { top: 900px; height: 96px; font-size: 52px; padding-left: 40px; }
  .info { position: absolute; left: 80px; right: 80px; bottom: 120px; display: flex; justify-content: space-between; align-items: flex-end; color: var(--arena-claro); }
  .info .k { font-family: var(--display); color: var(--arena); letter-spacing: .14em; font-size: 26px; text-transform: uppercase; }
  .info .v { font-family: var(--display); font-size: 58px; text-transform: uppercase; color: var(--crema); line-height: 1.05; margin-top: 6px; }
  .handle { left: 80px; bottom: 50px; font-size: 26px; opacity: .8; }
  .url { position: absolute; right: 80px; bottom: 50px; font-size: 24px; font-weight: 700; color: var(--arena); letter-spacing: .04em; }
</style></head>
<body>
<div class="canvas">
  <svg class="court"></svg>
  <img class="logo" src="../logo/esd-logo-arena.svg" alt="">
  <span class="tag naranja top-tag">Inscripciones abiertas</span>
  <svg class="ball" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M50 4v92M8 30c12 9 72 9 84 0M8 70c12-9 72-9 84 0"/></svg>
  <h1 class="display title"><small>ESD Street Series</small>Torneo<br><span class="o">3x3</span></h1>
  <div class="band"><span>Open</span><span class="dot">●</span><span>Senior</span><span class="dot">●</span><span>FIBA 3x3</span><span class="dot">●</span><span>Open</span><span class="dot">●</span><span>Senior</span><span class="dot">●</span><span>FIBA 3x3</span><span class="dot">●</span><span>Open</span></div>
  <div class="info">
    <div><div class="k">Fecha</div><div class="v">Próximamente</div></div>
    <div><div class="k">Sede</div><div class="v">Por anunciar</div></div>
    <div><div class="k">Cupos</div><div class="v">Limitados</div></div>
  </div>
  <div class="handle">@esdhoops</div>
  <div class="url">play.fiba3x3.com</div>
</div>
<script src="social.js"></script>
</body></html>
