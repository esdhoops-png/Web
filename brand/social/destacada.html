<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Portadas de destacadas</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1080px; }

  /* Uso: destacada.html#0 … #5 */
  .canvas { display: grid; place-items: center; background: var(--hueso); }
  .disc { width: 720px; height: 720px; border-radius: 50%; background: var(--papel); box-shadow: inset 0 0 0 2px var(--linea), 0 50px 90px -50px rgba(14,28,46,.45); display: grid; place-items: center; align-content: center; gap: 40px; }
  .disc svg { width: 250px; height: 250px; fill: none; stroke: var(--azul); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .disc .mono { font-size: 46px; }
</style></head>
<body>
<div class="canvas ">
  <div class="disc"><svg id="icon" viewBox="0 0 48 48"></svg><span class="mono" id="lbl"></span></div>
</div>
<script src="social.js"></script>
<script>
  const ICONS = [
    ['3x3', '<circle cx="24" cy="24" r="17"/><path d="M24 7v34M8.5 16c6 4 25 4 31 0M8.5 32c6-4 25-4 31 0"/>'],
    ['Liga', '<rect x="8" y="10" width="32" height="28" rx="3"/><path d="M8 18h32M16 6v8M32 6v8"/>'],
    ['Camps', '<circle cx="24" cy="16" r="7"/><path d="M10 41c1-9 6.5-14 14-14s13 5 14 14"/>'],
    ['Entrenos', '<path d="M6 38l10-20 8 11 6-9 12 18"/><circle cx="16" cy="14" r="2.5"/>'],
    ['Showcase', '<path d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24z"/><circle cx="24" cy="24" r="5"/>'],
    ['Info', '<circle cx="24" cy="24" r="17"/><path d="M24 22v11"/><circle cx="24" cy="15.5" r="1.4" fill="#172d47"/>'],
  ];
  const i = Math.min(ICONS.length - 1, parseInt(location.hash.slice(1) || '0', 10));
  document.getElementById('lbl').textContent = ICONS[i][0];
  document.getElementById('icon').innerHTML = ICONS[i][1];
</script>
</body></html>
