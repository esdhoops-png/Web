<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Carrusel — Nuestros programas</title>
<link rel="stylesheet" href="social.css">
<style>
  /* Uso: carrusel.html#0 (portada) … #5 */
  .canvas { --w: 1080px; --h: 1350px; }
  .court { width: 1300px; left: -110px; top: 820px; opacity: .1; }
  .logo { top: 70px; left: 80px; width: 96px; }
  .count { position: absolute; top: 92px; right: 80px; font-family: var(--display); font-size: 40px; color: var(--arena); letter-spacing: .1em; }
  .num { position: absolute; right: 50px; top: 170px; font-family: var(--display); font-size: 560px; line-height: .8; color: transparent; -webkit-text-stroke: 4px rgba(226,103,43,.55); }
  .eyebrow { position: absolute; left: 80px; top: 560px; }
  .title { position: absolute; left: 76px; top: 620px; font-size: 160px; right: 80px; }
  .body-text { position: absolute; left: 80px; right: 120px; top: 960px; }
  .swipe { position: absolute; right: 80px; bottom: 70px; font-family: var(--display); letter-spacing: .14em; font-size: 30px; color: var(--naranja); text-transform: uppercase; }
  .handle { left: 80px; bottom: 70px; font-size: 26px; opacity: .8; }
  .cover .title { top: 430px; font-size: 180px; }
  .cover .eyebrow { top: 380px; }
  .cover .body-text { top: 1010px; }
</style></head>
<body>
<div class="canvas" id="c">
  <svg class="court"></svg>
  <img class="logo" src="../logo/esd-logo-arena.svg" alt="">
  <div class="count" id="count"></div>
  <div class="num" id="num"></div>
  <div class="eyebrow" id="eb"></div>
  <h1 class="display title" id="title"></h1>
  <p class="body-text" id="txt"></p>
  <div class="handle">@esdhoops</div>
  <div class="swipe" id="swipe">Desliza →</div>
</div>
<script src="social.js"></script>
<script>
  const SLIDES = [
    ['Lo que hacemos', 'Nuestros<br><span class="n">progra-</span><br>mas', 'Cinco formatos para competir, desarrollarte y darte a conocer.'],
    ['Programa 01', 'Torneos<br><span class="o">3x3</span>', 'Competencias rápidas e intensas con la energía del baloncesto de calle a nivel competitivo.'],
    ['Programa 02', 'Liga 5x5<br><span class="a">estilo AAU</span>', 'Temporada regular, calendario de partidos y desarrollo continuo por equipos.'],
    ['Programa 03', 'Basketball<br><span class="n">camps</span>', 'Técnica, fundamentos y mentalidad competitiva junto a jugadores profesionales.'],
    ['Programa 04', 'Com-<br><span class="o">bines</span>', 'Evaluaciones de rendimiento físico y habilidades con métricas claras de progreso.'],
    ['Programa 05', 'Showcase<br><span class="a">camps</span>', 'Muéstrate ante equipos, programas y entrenadores en busca de nuevas oportunidades.'],
  ];
  const i = Math.min(SLIDES.length - 1, parseInt(location.hash.slice(1) || '0', 10));
  const [eb, title, txt] = SLIDES[i];
  document.getElementById('eb').textContent = eb;
  document.getElementById('title').innerHTML = title;
  document.getElementById('txt').textContent = txt;
  document.getElementById('count').textContent = `${String(i + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
  document.getElementById('num').textContent = i ? String(i).padStart(2, '0') : '';
  if (!i) document.getElementById('c').classList.add('cover');
  if (i === SLIDES.length - 1) document.getElementById('swipe').textContent = 'esdhoops.com';
</script>
</body></html>
