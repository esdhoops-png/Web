<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 13 · Presentación KGM</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  /* Foto del coche: assets/img/fotos/kgm-coche.jpg (si no existe se ve el fondo azul). Sustituye el texto KGM por su logo oficial */
  .canvas { display: grid; grid-template-rows: 260px 64px 702px 64px 260px; }
  .b1 img, .b3 img { transform: scale(1.8); }
  .tint.empty { background: linear-gradient(160deg, #2a4f7d, #1a3556); }
  .info { position: absolute; z-index: 2; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: var(--papel); text-align: center; }
  .lock { display: flex; align-items: center; gap: 18px; }
  .kgm { width: 210px; height: 120px; border-radius: 999px; display: grid; place-items: center; background: var(--papel); color: var(--azul); font-family: var(--display); font-size: 64px; letter-spacing: .06em; }
  .ttl { font-size: 120px; }
</style></head>
<body>
<div class="canvas dark">
  <div class="tint b1 empty"><img src="../../assets/img/fotos/kgm-coche.jpg" alt="" onerror="this.remove()"></div>
  <div class="ticker"><span>Partner oficial</span><span>ESD Hoops</span><span>KGM</span><span>Partner oficial</span><span>ESD Hoops</span><span>KGM</span></div>
  <div class="tint b2 empty"><img src="../../assets/img/fotos/kgm-coche.jpg" alt="" onerror="this.remove()">
    <div class="info">
      <div class="lock"><span class="badge"><img src="../logo/esd-logo-azul.svg" alt=""></span><span class="badge badge-t" style="font-family:var(--body);font-weight:300">×</span><span class="kgm">KGM</span></div>
      <h1 class="big ttl">Rodamos<br>juntos</h1>
      <span class="pill pill-light mono">Nuevo partner oficial</span>
    </div>
  </div>
  <div class="ticker"><span>Baloncesto de base</span><span>Eventos ESD</span><span>@esdhoops</span><span>Baloncesto de base</span></div>
  <div class="tint b3 empty"><img src="../../assets/img/fotos/kgm-coche.jpg" alt="" onerror="this.remove()"></div>
</div>
<script src="social.js"></script>
</body></html>
