<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Resultado final</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .court { width: 1100px; left: -10px; bottom: -120px; opacity: .1; }
  .logo { top: 70px; left: 80px; width: 100px; }
  .head { position: absolute; top: 92px; right: 80px; text-align: right; }
  .head .eyebrow { display: block; margin-bottom: 10px; }
  .head .t { font-family: var(--display); font-size: 40px; text-transform: uppercase; color: var(--arena); }
  .final { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-size: 180px; letter-spacing: .04em; }
  .board { position: absolute; left: 80px; right: 80px; top: 560px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px;
           background: rgba(14,28,46,.6); border: 3px solid rgba(212,192,179,.35); padding: 56px 40px; }
  .team { text-align: center; }
  .team .score { font-family: var(--display); font-size: 220px; line-height: .9; color: var(--crema); }
  .team.win .score { color: var(--naranja); }
  .team .name { font-family: var(--display); font-size: 40px; text-transform: uppercase; letter-spacing: .06em; color: var(--arena); margin-top: 18px; }
  .vs { font-family: var(--display); font-size: 60px; color: var(--arena); opacity: .6; }
  .meta { position: absolute; left: 80px; right: 80px; top: 1060px; display: flex; justify-content: space-between; font-family: var(--display); text-transform: uppercase; font-size: 32px; letter-spacing: .1em; color: var(--arena); }
  .meta b { color: var(--crema); font-weight: 400; }
  .handle { left: 80px; bottom: 60px; font-size: 26px; opacity: .8; }
</style></head>
<body>
<div class="canvas">
  <svg class="court"></svg>
  <img class="logo" src="../logo/esd-logo-arena.svg" alt="">
  <div class="head"><span class="eyebrow">Resultado</span><span class="t">ESD Street Series I · 3x3</span></div>
  <h1 class="display final"><span class="o">Final</span></h1>
  <div class="board">
    <div class="team win"><div class="score">21</div><div class="name">Equipo local</div></div>
    <div class="vs">–</div>
    <div class="team"><div class="score">18</div><div class="name">Equipo visita</div></div>
  </div>
  <div class="meta"><span>MVP <b>Nombre Apellido</b></span><span>Categoría <b>Open</b></span></div>
  <div class="handle">@esdhoops</div>
</div>
<script src="social.js"></script>
</body></html>
