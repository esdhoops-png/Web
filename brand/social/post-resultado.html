<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Resultado final</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }

  .panel { left: 60px; right: 60px; top: 130px; bottom: 130px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .ttl { font-size: 120px; text-align: center; margin: 60px 0 10px; }
  .sub { text-align: center; margin-bottom: 60px; }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .team .circle { width: 190px; height: 190px; display: grid; place-items: center; background: var(--hueso); box-shadow: inset 0 0 0 1.5px var(--linea); font-family: var(--display); font-size: 60px; }
  .team b { font-size: 24px; font-weight: 600; }
  .pts { font-family: var(--display); font-size: 170px; line-height: 1; }
  .pts.win { color: var(--azul); } .pts.lose { color: rgba(23,45,71,.35); }
  .vs { font-family: var(--mono); font-size: 26px; color: var(--suave); }
  .foot { margin-top: auto; display: flex; justify-content: center; }
</style></head>
<body>
<div class="canvas ">
  <svg class="arches"></svg>
  <div class="panel glass"><div class="in">
    <div class="top"><img class="logo" src="../logo/esd-logo-azul.svg" alt=""><span class="seg"><span class="on">Final</span><span>3x3</span></span><span class="pill pill-line">Categoría</span></div>
    <h1 class="big ttl">Resultado</h1>
    <p class="label sub">ESD Street Series</p>
    <div class="score">
      <div class="team"><span class="circle">EL</span><span class="pts win">21</span><b>Equipo local</b></div>
      <span class="vs">VS</span>
      <div class="team"><span class="circle">EV</span><span class="pts lose">18</span><b>Equipo visita</b></div>
    </div>
    <div class="foot"><span class="pill pill-soft">★ MVP · Nombre Apellido</span></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
