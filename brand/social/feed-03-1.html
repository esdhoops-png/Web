<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 03 · Recap 1</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .canvas { display: grid; grid-template-rows: 280px 64px 662px 64px 280px; }
  .info { position: absolute; z-index: 2; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: var(--papel); text-align: center; padding: 0 60px; }
  .badges { display: flex; gap: 14px; }
  .ttl { font-size: 112px; text-shadow: 0 10px 40px rgba(14,28,46,.45); }
  .b1 img { object-position: 50% 26%; transform: scale(2.3); transform-origin: 50% 26%; }
  .b3 img { object-position: 50% 40%; transform: scale(1.6); transform-origin: 50% 30%; }
  .b2 img { object-position: 50% 42%; }
</style></head>
<body>
<div class="canvas dark">
  <div class="tint b1"><img src="../../assets/img/fotos/street-series-campeones.jpg" alt=""></div>
  <div class="ticker"><span>ESD Street Series I</span><span>3x3</span><span>FIBA</span><span>Recap</span><span>ESD Street Series I</span></div>
  <div class="tint b2"><img src="../../assets/img/fotos/accion-salto.jpg" alt="">
    <div class="info">
      <div class="badges"><span class="badge"><img src="../logo/esd-logo-azul.svg" alt=""></span><span class="badge badge-t">I</span></div>
      <h1 class="big ttl">Así fue el<br>Street Series</h1>
      <span class="pill pill-light mono">Desliza →</span>
    </div>
  </div>
  <div class="ticker"><span>Gracias familia</span><span>@esdhoops</span><span>Gracias familia</span><span>@esdhoops</span></div>
  <div class="tint b3"><img src="../../assets/img/fotos/accion-dribbling.jpg" alt=""></div>
</div>
<script src="social.js"></script>
</body></html>
