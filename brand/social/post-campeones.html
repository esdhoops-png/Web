<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Campeones por categoría</title>
<link rel="stylesheet" href="social.css">
<style>
  /* Campeones ESD Street Series I: Street Flavour. Cambia foto y nombre para otras categorías */
  .canvas { --w: 1080px; --h: 1350px; }
  .photo { position: absolute; left: 0; right: 0; top: 0; height: 930px; clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%); }
  .photo img { width: 100%; height: 118%; object-fit: cover; object-position: 50% 30%; }
  .logo { top: 60px; left: 70px; width: 86px; }
  .cat { position: absolute; top: 76px; right: 70px; }
  .title { position: absolute; left: 76px; top: 960px; font-size: 150px; }
  .team { position: absolute; left: 80px; top: 1130px; font-family: var(--display); font-size: 58px; text-transform: uppercase; color: var(--arena); letter-spacing: .04em; }
  .handle { right: 80px; bottom: 60px; font-size: 26px; opacity: .8; }
  .court { width: 700px; right: -160px; bottom: -240px; opacity: .1; }
</style></head>
<body>
<div class="canvas">
  <div class="photo"><img src="../../assets/img/fotos/street-series-campeones-1.jpg" alt=""></div>
  <svg class="court"></svg>
  <img class="logo" src="../logo/esd-logo-azul.svg" alt="">
  <span class="tag naranja cat">ESD Street Series I</span>
  <h1 class="display title"><span class="n">Campeones</span></h1>
  <div class="team">Street Flavour</div>
  <div class="handle">@esdhoops</div>
</div>
<script src="social.js"></script>
</body></html>
