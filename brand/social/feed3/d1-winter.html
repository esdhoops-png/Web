<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Opción D · Winter Classic</title>
<link rel="stylesheet" href="feed3.css">
<style>

.bg { position: absolute; inset: 0; }
.bg img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05) brightness(.95); }
.bg::after { content: ''; position: absolute; inset: 0; background: var(--tinte); mix-blend-mode: color; }
.bg::before { content: ''; position: absolute; inset: 0; z-index: 1; background: rgba(23,45,71,.35); mix-blend-mode: multiply; }
.wm { left: 0; right: 0; top: 46px; text-align: center; font: 800 26px/1 'Archivo'; font-stretch: 100%; letter-spacing: .08em; text-transform: uppercase; color: rgba(14,28,46,.55); z-index: 2; }
.card { left: 190px; top: 205px; width: 700px; height: 940px; overflow: hidden; background: linear-gradient(180deg, #08121e 0%, #0e1c2e 30%, #1f3f66 75%, #4a6f99 100%); box-shadow: 0 40px 80px rgba(0,0,0,.35); z-index: 2; }
.logos { z-index: 1; position: absolute; left: 0; right: 0; top: 120px; display: flex; justify-content: center; align-items: center; gap: 22px; }
.logos .o { width: 120px; height: 120px; border-radius: 50%; background: var(--hueso); display: grid; place-items: center; }
.logos .o img { width: 70px; }
.logos .o.t { background: none; border: 3px solid var(--hueso); font: 800 52px/1 'Archivo'; font-stretch: 80%; color: var(--hueso); }
.logos .x { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--hueso); display: grid; place-items: center; font: 800 34px/1 'Archivo'; color: var(--hueso); }
.pill { z-index: 1; position: absolute; left: 50%; translate: -50% 0; top: 262px; padding: 14px 30px 12px; border: 3px solid var(--hueso); border-radius: 999px; font: 800 44px/1 'Archivo'; font-stretch: 90%; color: var(--hueso); white-space: nowrap; }
.ln { position: absolute; left: 0; right: 0; text-align: center; z-index: 1; font: 500 26px/1.5 'Plex Mono'; letter-spacing: .06em; text-transform: uppercase; color: var(--hueso); }
.serif { position: absolute; left: 0; right: 0; top: 440px; z-index: 1; text-align: center; font: 400 54px/1 'Instrument Serif'; color: var(--hueso); }
.serif i { font-size: 66px; }
.inner { position: absolute; left: 50%; bottom: 0; translate: -50% 0; height: 600px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.4)); }

</style></head>
<body><div class="canvas grain ">
<div class="bg"><img src="../../../assets/img/fotos/accion-tiro.jpg" alt="" style="transform:scale(2.1);transform-origin:52% 26%"></div>
<div class="abs wm">ESD Hoops</div>
<div class="abs card"><div class="logos"><span class="o"><img src="../../logo/esd-logo-azul.svg" alt=""></span></div>
 <div class="pill">26 DIC</div>
 <div class="ln" style="top:352px">Winter Classic · Torneo 3x3<br>ESD Street Series II</div>
 <div class="serif">inscripciones <i>muy pronto</i></div>
 <img class="inner" src="recortes/c-balon.png" alt=""></div>
</div><script>document.fonts.ready.then(()=>document.querySelectorAll('[data-fit]').forEach(el=>{let f=parseFloat(getComputedStyle(el).fontSize);const W=+el.dataset.fit;while(el.offsetWidth>W&&f>20){f-=4;el.style.fontSize=f+'px'}}))</script></body></html>
