<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Entrenamientos ESD</title>
<link rel="stylesheet" href="social.css">
<style>
  /* Foto: guarda el archivo como assets/img/fotos/entrenamiento.jpg */
  .canvas { --w: 1080px; --h: 1350px; }
  .photo { position: absolute; inset: 0; background: linear-gradient(160deg, var(--cancha), var(--noche)); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo .court { width: 1300px; left: -110px; top: 260px; opacity: .14; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,28,46,.92) 0%, rgba(14,28,46,.55) 55%, rgba(14,28,46,0) 100%); }
  .logo { top: 70px; left: 80px; width: 92px; }
  .eyebrow { position: absolute; left: 80px; }
  .title { position: absolute; left: 76px; top: 300px; font-size: 170px; }
  .eyebrow { top: 240px; }
  .rows { position: absolute; left: 80px; width: 560px; bottom: 150px; color: var(--arena-claro); }
  .rows span { font-size: 32px; }
  .rows b { font-size: 44px; }
  .handle { left: 80px; bottom: 70px; font-size: 26px; opacity: .8; }
  .tag { position: absolute; right: 80px; bottom: 60px; }
</style></head>
<body>
<div class="canvas">
  <div class="photo"><svg class="court"></svg><img src="../../assets/img/fotos/entrenamiento.jpg" alt="" onerror="this.remove()"></div>
  <div class="shade"></div>
  <img class="logo" src="../logo/esd-logo-arena.svg" alt="">
  <div class="eyebrow">ESD Training</div>
  <h1 class="display title">Entrena<br><span class="o">con</span><br><span class="n">nosotros</span></h1>
  <div class="rows">
    <div><b>01</b><span>Técnica individual</span></div>
    <div><b>02</b><span>Tiro y finalizaciones</span></div>
    <div><b>03</b><span>Físico y mentalidad</span></div>
  </div>
  <div class="handle">@esdhoops</div>
  <span class="tag">Plazas limitadas</span>
</div>
<script src="social.js"></script>
</body></html>
