<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Entrenamientos</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }

  /* Foto: guárdala como assets/img/fotos/entrenamiento.jpg (si no existe se usa el balón) */
  .phone { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 620px; border-radius: 64px; }
  .phone > .in { border-radius: 52px; background: var(--hueso); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .card { position: relative; background: var(--papel); border-radius: 44px; padding: 40px 36px 34px; overflow: hidden; }
  .ttl { font-size: 104px; margin-top: 12px; position: relative; z-index: 1; }
  .card .ball { width: 300px; margin: -40px 0 24px auto; }
  .row { display: flex; gap: 8px; background: var(--papel); border-radius: 999px; padding: 10px; }
  .row .chip { flex: 1; }
  .darkc { background: var(--azul); border-radius: 44px; padding: 26px 18px 18px; color: var(--papel); text-align: center; }
  .darkc .big { font-size: 58px; margin-bottom: 18px; }
  .ph { position: relative; height: 230px; border-radius: 32px; overflow: hidden; background: #2a4f7d; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 20px; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
  .ph > *:not(img) { position: relative; }
</style></head>
<body>
<div class="canvas ">
  <svg class="arches"></svg>
  <div class="phone glass"><div class="in">
    <div class="card">
      <p class="label">ESD Training</p>
      <h1 class="big ttl">Ya estamos<br>entrenando</h1>
      <div class="ball" data-angle="1.4"></div>
      <span class="pill pill-line" style="width:100%">Quiero entrenar</span>
    </div>
    <div class="row"><span class="chip">Técnica</span><span class="chip">Tiro</span><span class="chip">Físico</span></div>
    <div class="darkc"><p class="big">Mejora tu juego</p><div class="ph"><img src="../../assets/img/fotos/entrenamiento.jpg" alt="" onerror="this.remove()"><span class="mono">Grupos por edad y nivel</span><span class="pill pill-soft">★ Plazas limitadas</span></div></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
