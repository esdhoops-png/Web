<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 06 · ¿Quién les quita la corona?</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .panel { left: 60px; right: 60px; top: 90px; bottom: 90px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; margin: 54px 0 30px; }
  .ttl { font-size: 116px; }
  .photo { border-radius: 30px; overflow: hidden; flex: 1; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; }
  .photo .pill-soft { position: absolute; left: 50%; bottom: 28px; translate: -50% 0; }
  .q { margin-top: 26px; display: flex; justify-content: space-between; align-items: baseline; }
  .q b { font-family: var(--display); font-weight: 400; font-size: 54px; text-transform: uppercase; }
</style></head>
<body>
<div class="canvas ">
  <div class="bgphoto"><img src="../../assets/img/fotos/street-series-campeones-2.jpg" alt=""></div>
  <div class="panel glass"><div class="in">
    <div class="top"><img class="logo" src="../logo/esd-logo-azul.svg" alt=""><span class="seg"><span class="on">Campeones</span><span>Street Series I</span></span><span class="pill pill-line">@esdhoops</span></div>
    <div class="head"><h1 class="big ttl">Street<br>Flavour</h1><p class="label">Campeones vigentes</p></div>
    <div class="photo"><img src="../../assets/img/fotos/street-series-campeones-1.jpg" alt=""><span class="pill pill-soft">★ Campeones ESD Street Series I</span></div>
    <div class="q"><b>¿Quién les quita la corona?</b><span class="mono">26 DIC</span></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
