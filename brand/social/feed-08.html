<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 08 · Mejora tu tiro</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .frame { position: absolute; left: 50px; right: 50px; top: 50px; bottom: 50px; border-radius: 60px; }
  .frame > .in { position: relative; height: 100%; border-radius: 48px; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .frame .in::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(14,28,46,.75), transparent 45%); }
  .txt { position: absolute; z-index: 2; left: 60px; right: 60px; bottom: 60px; color: var(--papel); display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .txt .big { font-size: 120px; }
  .txt .label { color: rgba(246,243,240,.8); margin-bottom: 14px; }
</style></head>
<body>
<div class="canvas stone">
  <div class="frame glass"><div class="in">
    <img src="../../assets/img/fotos/accion-tiro.jpg" alt="">
    <div class="txt"><div><p class="label">ESD Training</p><h1 class="big">Mejora<br>tu tiro</h1></div><span class="pill pill-soft">Info por DM</span></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
