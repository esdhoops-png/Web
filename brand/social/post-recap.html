<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Recap ESD Street Series I</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }

  .canvas { display: grid; grid-template-rows: 300px 64px 622px 64px 300px; }
  .b1 img { object-position: 50% 26%; transform: scale(2.3); transform-origin: 50% 26%; }
  .b3 img { object-position: 50% 40%; transform: scale(1.9); transform-origin: 62% 32%; }
  .b2 img { object-position: 50% 42%; }
  .info { position: absolute; z-index: 2; right: 70px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; align-items: center; gap: 22px; color: var(--papel); text-align: center; }
  .badges { display: flex; gap: 14px; }
  .ttl { font-size: 104px; text-shadow: 0 10px 40px rgba(14,28,46,.4); }
  .meta { line-height: 1.7; }
  .meta b { font-family: var(--display); font-weight: 400; font-size: 46px; letter-spacing: .04em; }
</style></head>
<body>
<div class="canvas dark">
  <div class="tint b1"><img src="../../assets/img/fotos/street-series-campeones.jpg" alt=""></div>
  <div class="ticker"><span>ESD</span><span>Street Series I</span><span>3x3</span><span>FIBA</span><span>Campeones</span><span>Street Flavour</span><span>ESD</span></div>
  <div class="tint b2"><img src="../../assets/img/fotos/street-series-campeones-1.jpg" alt="">
    <div class="info">
      <div class="badges"><span class="badge"><img src="../logo/esd-logo-azul.svg" alt=""></span><span class="badge badge-t">I</span></div>
      <h1 class="big ttl">ESD Street<br>Series</h1>
      <span class="pill pill-light mono">Recap · 3x3</span>
      <p class="mono meta">Campeones<br><b>Street Flavour</b></p>
    </div>
  </div>
  <div class="ticker"><span>Gracias familia</span><span>@esdhoops</span><span>Nos vemos en la próxima</span><span>Gracias familia</span></div>
  <div class="tint b3"><img src="../../assets/img/fotos/street-series-jugador.jpg" alt=""></div>
</div>
<script src="social.js"></script>
</body></html>
