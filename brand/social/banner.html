<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Banners</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1500px; --h: 500px; }

  /* Uso: banner.html#x (1500×500) · #linkedin (1584×396) · #youtube (2560×1440) · #facebook (1640×624) */
  .bar { position: absolute; left: 50%; top: 50%; translate: -50% -50%; border-radius: 999px; }
  .bar > .in { height: 100%; border-radius: 999px; background: var(--papel); display: flex; align-items: center; gap: 4%; padding: 0 5%; }
  .bar .ball { height: 72%; width: auto; }
  .words { display: flex; flex-direction: column; gap: 6px; }
  .words .big { line-height: .9; }
</style></head>
<body>
<div class="canvas ">
  <div class="bgphoto"><img src="../../assets/img/fotos/street-series-campeones.jpg" alt=""></div>
  <div class="bar glass" id="bar"><div class="in">
    <div class="ball" data-angle="0.8"></div>
    <div class="words"><p class="label" id="l">Basketball events</p><p class="big" id="t">ESD Hoops</p></div>
    <img src="../logo/esd-logo-azul.svg" alt="" id="lg" style="margin-left:auto">
  </div></div>
</div>
<script src="social.js"></script>
<script>
  const S = { x: [1500, 500, 860, 240], linkedin: [1584, 396, 900, 200], youtube: [2560, 1440, 1400, 330], facebook: [1640, 624, 1000, 260] };
  const k = location.hash.slice(1) in S ? location.hash.slice(1) : 'x';
  const [w, h, bw, bh] = S[k];
  const c = document.querySelector('.canvas');
  c.style.setProperty('--w', w + 'px'); c.style.setProperty('--h', h + 'px');
  const bar = document.getElementById('bar');
  bar.style.width = bw + 'px'; bar.style.height = bh + 'px';
  document.getElementById('t').style.fontSize = bh * 0.34 + 'px';
  document.getElementById('l').style.fontSize = Math.max(12, bh * 0.07) + 'px';
  document.getElementById('lg').style.height = bh * 0.42 + 'px';
  document.querySelector('.ball').style.width = bh * 0.72 + 'px';
</script>
</body></html>
