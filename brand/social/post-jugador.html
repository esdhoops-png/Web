<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — MVP / jugador destacado</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }

  .phone { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 620px; border-radius: 64px; }
  .phone > .in { border-radius: 52px; background: var(--hueso); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--papel); border-radius: 44px; padding: 40px 36px 34px; }
  .ttl { font-size: 104px; margin: 12px 0 26px; }
  .circle { width: 100%; aspect-ratio: 1; border-radius: 36px; }
  .circle img { object-position: 50% 30%; }
  .stats { display: flex; gap: 10px; background: var(--papel); border-radius: 999px; padding: 12px; }
  .stats .chip { flex: 1; flex-direction: column; height: auto; padding: 14px 0; gap: 2px; border-radius: 40px; }
  .stats b { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; }
  .stats small { font-size: 16px; color: var(--suave); letter-spacing: .08em; text-transform: uppercase; }
</style></head>
<body>
<div class="canvas stone">
  <svg class="arches"></svg>
  <div class="phone glass"><div class="in">
    <div class="card">
      <p class="label">MVP · ESD Street Series I</p>
      <h1 class="big ttl">Nombre<br>Apellido</h1>
      <div class="circle color"><img src="../../assets/img/fotos/street-series-jugador.jpg" alt=""></div>
    </div>
    <div class="stats"><span class="chip"><b>12</b><small>Puntos</small></span><span class="chip"><b>06</b><small>Rebotes</small></span><span class="chip"><b>04</b><small>Asist.</small></span></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
