<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post — Cápsula de evento</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }

  .cap { left: 50%; top: 50%; translate: -50% -50%; width: 540px; height: 940px; }
  .cap > .in { padding: 30px 30px 46px; }
  .cap .circle { width: 452px; height: 452px; }
  .cap .circle .seg { position: absolute; left: 50%; bottom: 34px; translate: -50% 0; }
  .lbl { margin-top: 46px; }
  .ttl { margin-top: 18px; font-size: 118px; }
  .logo { margin-top: auto; width: 46px; }
  .foot { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; }
</style></head>
<body>
<div class="canvas ">
  <div class="bgphoto"><img src="../../assets/img/fotos/street-series-campeones-2.jpg" alt=""></div>
  <div class="cap glass"><div class="in">
    <div class="circle"><img src="../../assets/img/fotos/street-series-jugador.jpg" alt=""><span class="seg"><span>Street Series</span><span class="on">3x3</span></span></div>
    <p class="label lbl">Basketball events</p>
    <h1 class="big ttl">ESD<br>Hoops</h1>
    <img class="logo" src="../logo/esd-logo-azul.svg" alt="">
  </div></div>
  <p class="mono foot">@esdhoops</p>
</div>
<script src="social.js"></script>
</body></html>
