<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 05 · Formato 3x3</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .panel { left: 60px; right: 60px; top: 90px; bottom: 90px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .ttl { font-size: 120px; margin: 60px 0 16px; }
  .sub { margin-bottom: 46px; }
  .rule { display: flex; align-items: center; gap: 30px; padding: 26px 0; border-top: 2px solid var(--linea); }
  .rule .circ { width: 130px; height: 130px; border-radius: 50%; background: var(--hueso); box-shadow: inset 0 0 0 1.5px var(--linea); display: grid; place-items: center; font-family: var(--display); font-size: 54px; flex: none; }
  .rule b { font-size: 38px; font-weight: 600; display: block; }
  .rule span { font-size: 26px; color: var(--suave); }
  .foot { margin-top: auto; display: flex; justify-content: center; }
</style></head>
<body>
<div class="canvas ">
  <svg class="arches"></svg>
  <div class="panel glass"><div class="in">
    <div class="top"><img class="logo" src="../logo/esd-logo-azul.svg" alt=""><span class="seg"><span class="on">Winter Classic</span><span>26 DIC</span></span><span class="pill pill-line">3x3 FIBA</span></div>
    <h1 class="big ttl">Así se juega</h1>
    <p class="label sub">ESD Street Series II · Reglamento FIBA 3x3</p>
    <div class="rule"><span class="circ">3+1</span><div><b>3 en pista y 1 cambio</b><span>Equipos de 4 jugadores</span></div></div>
    <div class="rule"><span class="circ">21</span><div><b>A 21 puntos o 10 minutos</b><span>Lo que llegue antes</span></div></div>
    <div class="rule"><span class="circ">1</span><div><b>Una canasta</b><span>Media pista, ritmo sin pausa</span></div></div>
    <div class="foot"><span class="pill pill-soft">★ Inscripciones muy pronto</span></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
