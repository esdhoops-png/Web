<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 10 · Juego de calle</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .canvas { display: grid; grid-template-rows: 280px 64px 662px 64px 280px; }
  .info { position: absolute; z-index: 2; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: var(--papel); text-align: center; padding: 0 60px; }
  .badges { display: flex; gap: 14px; }
  .ttl { font-size: 112px; text-shadow: 0 10px 40px rgba(14,28,46,.45); }
  .b1 img { object-position: 50% 30%; transform: scale(2); transform-origin: 40% 30%; }
  .b3 img { object-position: 50% 60%; transform: scale(1.8); transform-origin: 50% 70%; }
  .b2 img { object-position: 50% 35%; }
</style></head>
<body>
<div class="canvas dark">
  <div class="tint b1"><img src="../../assets/img/fotos/accion-street-flavour.jpg" alt=""></div>
  <div class="ticker"><span>ESD Street Series</span><span>3x3</span><span>Winter Classic</span><span>26 DIC</span><span>ESD Street Series</span></div>
  <div class="tint b2"><img src="../../assets/img/fotos/accion-dribbling.jpg" alt="">
    <div class="info">
      <div class="badges"><span class="badge"><img src="../logo/esd-logo-azul.svg" alt=""></span><span class="badge badge-t">II</span></div>
      <h1 class="big ttl">Juego de calle,<br>nivel de pista</h1>
      <span class="pill pill-light mono">26 DIC · 3x3</span>
    </div>
  </div>
  <div class="ticker"><span>Prepara a tu equipo</span><span>@esdhoops</span><span>Prepara a tu equipo</span></div>
  <div class="tint b3"><img src="../../assets/img/fotos/accion-salto.jpg" alt=""></div>
</div>
<script src="social.js"></script>
</body></html>
