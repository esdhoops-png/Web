<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Feed 14 · Escríbenos ENTRENO</title>
<link rel="stylesheet" href="social.css">
<style>
  .canvas { --w: 1080px; --h: 1350px; }
  .panel { left: 60px; right: 60px; top: 90px; bottom: 90px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .ttl { font-size: 128px; margin: 70px 0 20px; }
  .chat { margin-top: 30px; display: flex; flex-direction: column; gap: 18px; }
  .msg { align-self: flex-end; background: var(--azul); color: var(--papel); border-radius: 40px 40px 10px 40px; padding: 26px 40px; font-family: var(--display); font-size: 80px; letter-spacing: .04em; }
  .rep { align-self: flex-start; background: var(--hueso); border-radius: 40px 40px 40px 10px; padding: 24px 34px; font-size: 30px; font-weight: 500; max-width: 80%; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
</style></head>
<body>
<div class="canvas stone">
  <svg class="arches"></svg>
  <div class="panel glass"><div class="in">
    <div class="top"><img class="logo" src="../logo/esd-logo-azul.svg" alt=""><span class="seg"><span class="on">ESD Training</span><span>DM</span></span><span class="pill pill-line">@esdhoops</span></div>
    <h1 class="big ttl">¿Quieres<br>entrenar?</h1>
    <p class="label">Mándanos esta palabra</p>
    <div class="chat"><span class="msg">ENTRENO</span><span class="rep">¡Hola! Te contamos horarios, grupos y cómo apuntarte 🏀</span></div>
    <div class="foot"><span class="mono">info@esdhoops.com</span><span class="pill pill-dark">Escríbenos</span></div>
  </div></div>
</div>
<script src="social.js"></script>
</body></html>
