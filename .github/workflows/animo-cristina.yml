name: Ánimo diario para Cristina
on:
  schedule:
    - cron: "7 9 * * *"   # 09:07 hora canaria
  workflow_dispatch:
  push:
    paths: [".github/workflows/animo-cristina.yml"]
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/animo.js
