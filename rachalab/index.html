<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RachaLab</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121314">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RachaLab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna (máx. 680px) bajo una cabecera negra fija y una barra de pestañas abajo, pensada para usarse con una mano. */
:root {
  --bg: #f4f3ee;
  --paper: #ffffff;
  --ink: #141414;
  --muted: #5f6066;
  --line: #e1dfd6;
  --soft: #ecebe4;
  --night: #121314;
  --on-night: #f4f3ee;
  --acc: #ffd83d;
  --on-acc: #141414;
  --acc-text: #7a5f00;
  --acc-soft: #fff4c2;
  --ok: #12804a;
  --ok-soft: #e2f3e9;
  --run: #d1495b;
  --row: #2f6fb3;
  --str: #7a4fb5;
  --hyb: #c77700;
  --easy: #2c8c74;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f10; --paper: #18191b; --ink: #ecebe6; --muted: #9c9da3; --line: #2a2b2f; --soft: #222326;
    --acc-text: #ffd83d; --acc-soft: #2e2810; --ok: #4cd38b; --ok-soft: #15301f;
    --run: #ff7a8a; --row: #6aa8ec; --str: #b693ea; --hyb: #f0a63a; --easy: #5fd0b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f10; --paper: #18191b; --ink: #ecebe6; --muted: #9c9da3; --line: #2a2b2f; --soft: #222326;
  --acc-text: #ffd83d; --acc-soft: #2e2810; --ok: #4cd38b; --ok-soft: #15301f;
  --run: #ff7a8a; --row: #6aa8ec; --str: #b693ea; --hyb: #f0a63a; --easy: #5fd0b2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; line-height: 1.1; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* Cabecera */
.top { position: sticky; top: 0; z-index: 20; background: var(--night); color: var(--on-night); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
.top-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.logo b { color: var(--acc); }
.logo svg { width: 26px; height: 26px; }
.top .sp { flex: 1; }
.wk-chip { white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 15px; background: #2a2b2f; color: var(--on-night); padding: 3px 10px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; }
.icon-btn { background: transparent; border: 0; color: inherit; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(255,255,255,.08); }
.icon-btn svg { width: 22px; height: 22px; }

main { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }

/* Barra de pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .tab-ic { background: var(--acc); color: var(--on-acc); }
.tab-ic { border-radius: 999px; padding: 3px 16px; display: grid; place-items: center; }

/* Piezas */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 24px; }
.card h3 { font-size: 19px; }
.eyebrow { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 16px; font-weight: 700; text-decoration: none; min-height: 46px; }
.btn.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.btn.dark { background: var(--night); color: var(--on-night); border-color: var(--night); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn svg { width: 20px; height: 20px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.pill.acc { background: var(--acc-soft); color: var(--acc-text); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }

.t-run { --c: var(--run); } .t-row { --c: var(--row); } .t-str { --c: var(--str); } .t-hyb { --c: var(--hyb); } .t-easy { --c: var(--easy); }
.tdot { width: 10px; height: 10px; border-radius: 999px; background: var(--c); flex: none; }
.ttag { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }

/* Hoy */
.hero { background: var(--night); color: var(--on-night); border-color: #2a2b2f; position: relative; overflow: hidden; isolation: isolate; }
.hero .eyebrow { color: #a9aab0; }
.hero h2 { font-size: 34px; }
.hero .muted { color: #b9bac0; }
.hero::after { content: ""; position: absolute; right: -30px; top: -20px; width: 150px; height: 150px; background: var(--c, var(--acc)); opacity: .18; transform: skewX(-20deg); z-index: -1; }
.hero-meta { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 14px; font-weight: 600; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero-meta svg { width: 18px; height: 18px; opacity: .8; }
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.wd { text-align: center; border-radius: 10px; padding: 6px 0 8px; background: var(--soft); font-size: 12px; font-weight: 700; color: var(--muted); border: 2px solid transparent; }
.wd .d { font-family: var(--display); font-size: 18px; color: var(--ink); display: block; }
.wd .mk { display: block; width: 8px; height: 8px; margin: 3px auto 0; border-radius: 999px; background: transparent; }
.wd.has .mk { background: var(--c); }
.wd.done { background: var(--ok-soft); }
.wd.done .mk { background: var(--ok); }
.wd.today { border-color: var(--ink); }
button.wd { cursor: pointer; }
.progressbar { height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.progressbar i { display: block; height: 100%; background: var(--acc); border-radius: 999px; }
.hero .progressbar { background: #2a2b2f; }

/* Lista de sesiones */
.slist { list-style: none; margin: 0; padding: 0; }
.sitem { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.slist li:first-child .sitem { border-top: 0; }
.sitem .day { width: 38px; flex: none; font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; color: var(--muted); }
.sitem .tt { font-weight: 700; line-height: 1.25; }
.sitem .ss { font-size: 14px; color: var(--muted); }
.check { width: 28px; height: 28px; flex: none; border-radius: 999px; border: 2px solid var(--line); display: grid; place-items: center; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check svg { width: 16px; height: 16px; }

/* Plan */
.phase { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.phase h2 { font-size: 26px; text-transform: uppercase; }
.phase .n { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--acc-text); }
.week { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
.week > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.week > summary::-webkit-details-marker { display: none; }
.week > summary .wn { font-family: var(--display); font-weight: 700; font-size: 19px; }
.week > summary .chev { transition: transform .2s; width: 18px; height: 18px; color: var(--muted); }
.week[open] > summary .chev { transform: rotate(90deg); }
.week .slist { padding: 0 10px 6px; }
.mini-bars { display: flex; gap: 3px; }
.mini-bars i { width: 14px; height: 6px; border-radius: 3px; background: var(--soft); }
.mini-bars i.on { background: var(--ok); }
.week.cur { border-color: var(--ink); }

/* Detalle de sesión (hoja) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 680px; max-height: 94vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 0 0 calc(20px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--night); color: var(--on-night); padding: 14px 16px 16px; }
.sheet-head .row { align-items: flex-start; }
.sheet-head h2 { font-size: 30px; }
.sheet-head .muted { color: #b9bac0; }
.sheet-body { padding: 16px; }
.blk { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.blk h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.blk h3 .n { width: 24px; height: 24px; border-radius: 999px; background: var(--c, var(--acc)); color: #fff; display: grid; place-items: center; font-size: 14px; }
.blk ul { margin: 0; padding-left: 20px; }
.blk li { margin: 4px 0; }
.blk li::marker { color: var(--muted); }
.tip { background: var(--acc-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; }
.tip svg { width: 22px; height: 22px; flex: none; color: var(--acc-text); margin-top: 1px; }
.exl { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline; text-decoration-color: var(--acc); text-decoration-thickness: 2px; text-underline-offset: 3px; text-align: left; }

/* Formulario de registro */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea.inp { min-height: 70px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; min-width: 40px; height: 40px; padding: 0 10px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Temporizador */
.timer { position: fixed; inset: 0; z-index: 90; background: var(--night); color: var(--on-night); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
.timer.k-work { background: #1d1410; }
.timer.k-rest { background: #0f1a14; }
.tm-top { display: flex; align-items: center; gap: 10px; max-width: 680px; margin: 0 auto; width: 100%; }
.tm-mid { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; max-width: 680px; margin: 0 auto; width: 100%; }
.tm-kind { font-family: var(--display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 18px; padding: 4px 14px; border-radius: 999px; background: #2a2b2f; }
.k-work .tm-kind { background: var(--run); color: #fff; }
.k-rest .tm-kind { background: #2c8c74; color: #fff; }
.tm-label { font-family: var(--display); font-size: clamp(30px, 8vw, 46px); font-weight: 700; margin: 14px 0 4px; line-height: 1.05; }
.tm-clock { font-family: var(--mono); font-weight: 600; font-size: clamp(76px, 26vw, 150px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tm-sub { color: #b9bac0; margin-top: 8px; min-height: 24px; }
.tm-next { margin-top: 18px; color: #b9bac0; }
.tm-next b { color: var(--on-night); }
.tm-bar { height: 6px; background: #2a2b2f; border-radius: 999px; overflow: hidden; margin: 18px 0 0; width: 100%; }
.tm-bar i { display: block; height: 100%; background: var(--acc); }
.tm-ctrl { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; max-width: 680px; margin: 0 auto; width: 100%; }
.tm-ctrl .btn { min-height: 64px; font-size: 18px; border-color: #2a2b2f; background: #222326; color: var(--on-night); }
.tm-ctrl .btn.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }

/* Progreso */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.kpi .v { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
.kpi .v small { font-size: 18px; font-weight: 600; color: var(--muted); }
.kpi .l { font-size: 13px; color: var(--muted); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
.log li:first-child { border-top: 0; }
.log .dt { width: 64px; flex: none; color: var(--muted); font-size: 13px; font-weight: 600; }

/* Guía */
.station { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.station:first-of-type { border-top: 0; }
.station .k { width: 44px; height: 44px; border-radius: 12px; background: var(--night); color: var(--acc); font-family: var(--display); font-weight: 800; font-size: 22px; display: grid; place-items: center; }
.station h3 { font-size: 20px; }
.station .home { margin-top: 4px; font-size: 15px; }
.station .home b { color: var(--acc-text); }
.exgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.exbtn { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 12px; font-weight: 700; min-height: 48px; line-height: 1.25; }
.exbtn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl th { font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
details.faq { border-top: 1px solid var(--line); padding: 10px 0; }
details.faq:first-of-type { border-top: 0; }
details.faq summary { font-weight: 700; cursor: pointer; }
details.faq p { margin: 8px 0 0; }

/* Bienvenida */
.welcome { min-height: 100vh; background: var(--night); color: var(--on-night); padding: calc(env(safe-area-inset-top) + 28px) 16px 40px; }
.welcome-in { max-width: 560px; margin: 0 auto; }
.welcome h1 { font-size: clamp(44px, 13vw, 72px); text-transform: uppercase; font-weight: 800; line-height: .95; }
.welcome h1 b { color: var(--acc); display: block; }
.welcome .lead { font-size: 18px; color: #c9cad0; margin: 14px 0 22px; }
.welcome .card { background: #1b1c1e; border-color: #2a2b2f; color: var(--on-night); }
.welcome .inp { background: #121314; border-color: #34353a; }
.welcome .chip { background: #121314; border-color: #34353a; }
.welcome .chip[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.welcome .muted { color: #a9aab0; }
.feat { display: grid; gap: 10px; margin: 0 0 22px; padding: 0; list-style: none; }
.feat li { display: flex; gap: 10px; align-items: flex-start; }
.feat svg { width: 22px; height: 22px; color: var(--acc); flex: none; margin-top: 1px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #34353a; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--acc); }
.opt b { display: block; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 80; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); }
@media (max-width: 380px) { .exgrid { grid-template-columns: 1fr; } .hero h2 { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
"use strict";
/* =========================================================
   RachaLab — Hyrox desde cero: plan de 16 semanas para casa
   (carrera + máquina de remo + fuerza con peso corporal,
   mochila y garrafas). Todo se guarda en este dispositivo.
   ========================================================= */

const LS_KEY = "rachalab-v1";
const SEMANAS = 16;
const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DIAS_L = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const ORDEN = { 3: ["run", "str", "row"], 4: ["run", "str", "row", "easy"], 5: ["run", "str", "row", "easy", "hyb"] };
const TIPOS = {
  run: { n: "Carrera", c: "t-run" },
  row: { n: "Remo", c: "t-row" },
  str: { n: "Fuerza", c: "t-str" },
  easy: { n: "Rodaje suave", c: "t-easy" },
  hyb: { n: "Híbrido", c: "t-hyb" },
};
const FASES = [
  { n: "Base", d: "Crear el hábito, aprender la técnica de remo y llegar a correr sin parar.", w: [1, 4] },
  { n: "Construcción", d: "Más volumen: carreras continuas, primeras series de remo y fuerza con mochila.", w: [5, 8] },
  { n: "Fuerza y motor", d: "Fuerza unilateral, cargas con garrafas y combinar correr con esfuerzos.", w: [9, 12] },
  { n: "Específico Hyrox", d: "Series de 1 km, estaciones caseras y tu primera simulación de Hyrox.", w: [13, 16] },
];
const DESCARGA = [4, 8, 12];
const TESTS = {
  row1k: { n: "1000 m remo", c: "var(--row)" },
  run1k: { n: "1 km carrera", c: "var(--run)" },
  sim: { n: "Mini Hyrox casero", c: "var(--hyb)" },
};

/* ---------- Ejercicios ---------- */
const EX = {

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fm = s => { const m = Math.floor(s / 60), r = s % 60; return m && r ? `${m}'${String(r).padStart(2, "0")}''` : m ? `${m}'` : `${r}''`; };
const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0"); };
const parseT = t => { t = String(t || "").trim().replace(",", "."); if (!t) return null; const p = t.split(":").map(Number); if (p.some(isNaN)) return null; if (p.length === 1) return Math.round(p[0] * 60); if (p.length === 2) return p[0] * 60 + p[1]; return p[0] * 3600 + p[1] * 60 + p[2]; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const lunesDe = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const wdIdx = d => (d.getDay() + 6) % 7;
const fechaCorta = d => `${d.getDate()} ${MESES[d.getMonth()]}`;
const hoy = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

/* ---------- Estado ---------- */
let state = loadLocal();
function nuevoEstado(p) { return { v: 1, nombre: p.nombre || "", dias: p.dias, inicio: p.inicio, nivel: p.nivel || 1, voz: true, logs: {}, tests: [], creado: Date.now() }; }
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && Array.isArray(s.dias)) { s.logs = s.logs || {}; s.tests = s.tests || []; return s; } } catch (e) {} return null; }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Calendario ---------- */
// La semana 1 empieza el lunes de la fecha de inicio. «nivel» desplaza el punto de partida (3 = empezar con algo de base).
function semanaDeFecha(d) {
  const diff = Math.floor((d - fromIso(state.inicio)) / 864e5);
  if (diff < 0) return 0;
  return Math.floor(diff / 7) + state.nivel;
}
function fechaDe(week, slot) {
  const lunes = addDays(fromIso(state.inicio), (week - state.nivel) * 7);
  return addDays(lunes, state.dias[slot]);
}
function tiposSemana() { return ORDEN[state.dias.length]; }
function sesionesSemana(w) { return tiposSemana().map((t, i) => ({ ...sesion(w, t), slot: i, fecha: w >= state.nivel ? fechaDe(w, i) : null })); }
function faseDe(w) { return FASES.findIndex(f => w >= f.w[0] && w <= f.w[1]); }
const hecho = id => !!state.logs[id];

/* ---------- Constructor de pasos del temporizador ---------- */
const P = (l, s, k = "work", sub = "") => ({ l, s, k, sub });
const calent = (s, l) => P(l || "Calentamiento", s, "prep");
const calma = (s, l) => P(l || "Vuelta a la calma", s, "prep");
function series(n, on, off, lOn, lOff, subOn = "", subOff = "") {
  const out = [];
  for (let i = 1; i <= n; i++) { out.push(P(lOn, on, "work", `${subOn ? subOn + " · " : ""}Serie ${i} de ${n}`)); if (i < n && off) out.push(P(lOff, off, "rest", subOff)); }
  return out;
}
const L = (k, t) => `[[${k}|${t}]]`;

/* ---------- El plan ---------- */
function sesion(w, t) {
  const f = faseDe(w), wi = (w - 1) % 4, s = { id: `w${w}-${t}`, w, t, fase: f, descarga: DESCARGA.includes(w) };
  return Object.assign(s, ({ run: sRun, row: sRow, str: sStr, easy: sEasy, hyb: sHyb })[t](w, wi));
}

const CAL_RUN = ["5' andando a paso vivo", `${L("movilidad", "Movilidad")}: 10 círculos de cadera, 10 balanceos de pierna por lado, 15 elevaciones de talón`];
const CALMA_RUN = ["5' andando suave", "Estira gemelo, cuádriceps e isquios (30'' cada uno)"];
const CAL_ROW = ["3' remando muy suave (solo brazos y cuerpo el primer minuto)", `10 ${L("sentadilla", "sentadillas")} y 10 balanceos de brazos`];
const CAL_STR = ["5' de remo suave o andar a paso vivo", `${L("movilidad", "Movilidad")} de cadera y hombros (2')`, "1 ronda del circuito con la mitad de repeticiones"];

function sRun(w) {
  const base = { warm: CAL_RUN, cool: CALMA_RUN, metric: "run" };
  const IV = { 1: [8, 60, 120], 2: [8, 90, 90], 3: [6, 120, 60], 4: [5, 180, 60], 5: [4, 300, 60], 6: [3, 480, 60], 7: [2, 720, 90] };
  if (IV[w]) {
    const [n, on, off] = IV[w];
    return { ...base, title: `Correr y andar: ${n} × ${fm(on)}`, mins: Math.round((n * on + (n - 1) * off) / 60) + 10,
      sub: `${n} tramos de ${fm(on)} trotando con ${fm(off)} andando`,
      main: [{ h: "Bloque principal", l: [`${n} × ( ${fm(on)} ${L("correr", "trotando suave")} + ${fm(off)} andando )`, "Si en algún tramo te ahogas, anda 30'' y sigue: terminar es lo que cuenta."] }],
      tip: w === 1 ? "Hoy no se trata de correr rápido. Ve tan lento que te parezca ridículo: así se construye la base sin lesiones." : w === 4 ? "Semana de asimilar. Tramos más largos pero el mismo ritmo cómodo." : w === 7 ? "Dos bloques de 12 minutos: la semana que viene ya corres 20' seguidos." : "Ritmo de charla: tienes que poder decir frases cortas mientras trotas.",
      steps: [calent(300, "Anda a paso vivo"), ...series(n, on, off, "Trota suave", "Anda"), calma(300, "Anda suave")] };
  }
  if (w === 8 || w === 16) {
    return { ...base, title: w === 8 ? "Test: 1 km de carrera" : "Test final: 1 km de carrera", mins: 30, test: "run1k",
      sub: "Calentar bien, 1 km a tope sostenible y soltar",
      main: [{ h: "Calentar", l: ["8' trote muy suave", "3 aceleraciones de 15'' (subiendo el ritmo poco a poco), andando 45'' entre ellas"] }, { h: "Test", l: ["<b>1 km</b> al ritmo más rápido que puedas mantener todo el kilómetro. Usa el GPS del móvil o un recorrido que conozcas.", "Empieza controlado: el primer tercio debe parecer fácil."] }, { h: "Soltar", l: ["10' trote o paseo muy suave"] }],
      tip: w === 8 ? "Apunta el tiempo: es tu referencia para calcular el ritmo de las series de 1 km de la fase específica." : "Compáralo con el test de la semana 8. ¡Mira lo que has avanzado!",
      steps: [calent(480, "Trote muy suave"), ...series(3, 15, 45, "Acelera progresivo", "Anda"), P("TEST 1 km — ¡vamos!", 0, "work", "Toca «Siguiente» al terminar el kilómetro"), calma(600, "Trote o paseo muy suave")] };
  }
  if (w === 10) return { ...base, title: "Cambios de ritmo 6 × 2'", mins: 40, sub: "6 × 2' alegre con 2' trote suave",
    main: [{ h: "Calentar", l: ["10' trote suave"] }, { h: "Bloque principal", l: [`6 × ( 2' a ritmo alegre (7/10) + 2' ${L("correr", "trote suave")} )`, "Alegre = respiras fuerte pero controlas; no es un sprint."] }, { h: "Soltar", l: ["5' trote muy suave"] }],
    tip: "Los cambios de ritmo enseñan a tu cuerpo a recuperar corriendo, justo lo que pasa entre estaciones de Hyrox.",
    steps: [calent(600, "Trote suave"), ...series(6, 120, 120, "Ritmo alegre", "Trote suave"), calma(300, "Trote muy suave")] };
  if (w >= 13 && w <= 15) {
    const n = { 13: 4, 14: 5, 15: 6 }[w], rest = w === 15 ? 90 : 120;
    return { ...base, title: `${n} × 1 km a ritmo Hyrox`, mins: 15 + n * 8, sub: `Series de 1 km con ${fm(rest)} de descanso`,
      main: [{ h: "Calentar", l: ["10' trote suave + 3 aceleraciones de 15''"] }, { h: "Bloque principal", l: [`${n} × <b>1 km</b> a ritmo Hyrox, ${fm(rest)} andando entre series`, "Ritmo Hyrox = el que podrías repetir 8 veces. Suele ser 20–40'' más lento por km que tu test de 1 km.", "Objetivo: que todas las series salgan casi iguales."] }, { h: "Soltar", l: ["5' trote muy suave"] }],
      tip: "Así es una carrera Hyrox: 8 kilómetros cortados por estaciones. Aprende tu ritmo aquí.",
      steps: [calent(600, "Trote suave"), ...series(3, 15, 45, "Acelera progresivo", "Anda"), ...series(n, 0, rest, "1 km a ritmo Hyrox", "Descansa andando", "Toca «Siguiente» al acabar el km"), calma(300, "Trote muy suave")] };
  }
  const C = { 9: 25, 11: 30, 12: 20 }[w];
  return { ...base, title: `${C}' de carrera continua`, mins: C + 10, sub: w === 12 ? "Semana de descarga: suave y corto" : `${C} minutos seguidos a ritmo de charla`,
    main: [{ h: "Bloque principal", l: [`${C}' ${L("correr", "corriendo suave")} sin parar`, "Si necesitas parar, anda 1' y retoma."] }],
    tip: w === 12 ? "Descargar también es entrenar: el cuerpo asimila y vuelves más fuerte." : "Mira cuánto has avanzado: hace unas semanas trotabas 1 minuto.",
    steps: [calent(300, "Anda a paso vivo"), P("Corre suave", C * 60, "work", "Ritmo de charla"), calma(300, "Anda suave")] };
}

function sRow(w) {
  const base = { warm: CAL_ROW, cool: ["3' remo muy suave", "Estira espalda (postura del niño), isquios y pecho"], metric: "row" };
  if (w === 1 || w === 8 || w === 16) {

function semanaCard(w, d, lista) {

  return `<div class="card"><div class="row"><p class="eyebrow grow">Semana ${w} · ${hechas}/${ses.length} hechas</p></div>
    <div class="weekstrip">${DIAS.map((n, i) => {
      const dd = addDays(lunes, i), s = ses.find(x => x.slot === state.dias.indexOf(i) && state.dias.includes(i));
      const cls = ["wd", s ? "has " + TIPOS[s.t].c : "", s && hecho(s.id) ? "done" : "", iso(dd) === iso(d) ? "today" : ""].join(" ");
      return s ? `<button class="${cls}" data-open="${s.id}" aria-label="${DIAS_L[i]}: ${esc(s.title)}">${n}<span class="d num">${dd.getDate()}</span><span class="mk"></span></button>` : `<div class="${cls}">${n}<span class="d num">${dd.getDate()}</span><span class="mk"></span></div>`;
    }).join("")}</div>
    ${lista ? `<ul class="slist" style="margin-top:8px">${ses.map(itemSesion).join("")}</ul>` : ""}</div>`;
}
function itemSesion(s) {

    <span class="day">${s.fecha ? DIAS[wdIdx(s.fecha)] : ""}</span>

function totalSesiones() { return (SEMANAS - state.nivel + 1) * state.dias.length; }
function totalHechas() { let n = 0; for (let w = state.nivel; w <= SEMANAS; w++) for (const t of tiposSemana()) if (hecho(`w${w}-${t}`)) n++; return n; }

/* ---------- Plan ---------- */
function vistaPlan() {
  const cur = semanaDeFecha(hoy());
  let out = `<div class="card"><h2>Tu plan de 16 semanas</h2><p class="muted" style="margin:6px 0 0">${state.dias.length} sesiones por semana: ${state.dias.map(i => DIAS_L[i]).join(", ")}. Cada 4 semanas hay una semana de descarga para asimilar.</p>

        <summary>${ICO.chev}<span class="wn">Semana ${w}</span>${DESCARGA.includes(w) ? '<span class="pill">Descarga</span>' : ""}${w === cur ? '<span class="pill acc">Ahora</span>' : ""}

/* ---------- Progreso ---------- */
function vistaProgreso() {
  const logs = Object.entries(state.logs).map(([id, l]) => ({ id, ...l })).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || b.ts - a.ts);
  const km = logs.reduce((a, l) => a + (l.km || 0), 0), m = logs.reduce((a, l) => a + (l.m || 0), 0), min = logs.reduce((a, l) => a + (l.min || 0), 0);
  const racha = rachaSemanas();
  let out = `<div class="kpis">
    <div class="kpi"><div class="v num">${totalHechas()}<small>/${totalSesiones()}</small></div><div class="l">Sesiones hechas</div></div>
    <div class="kpi"><div class="v num">${racha}<small> sem.</small></div><div class="l">Racha de semanas completas</div></div>
    <div class="kpi"><div class="v num">${km.toLocaleString("es-ES", { maximumFractionDigits: 1 })}<small> km</small></div><div class="l">Corridos (apuntados)</div></div>
    <div class="kpi"><div class="v num">${(m / 1000).toLocaleString("es-ES", { maximumFractionDigits: 1 })}<small> km</small></div><div class="l">Remados (apuntados)</div></div>
  </div>`;
  out += `<div class="card"><div class="row"><h3 class="grow">Tests</h3><button class="btn sm" id="btn-addtest">+ Añadir test</button></div>${graficoTests()}</div>`;
  out += `<div class="card"><h3>Constancia por semana</h3>${graficoSemanas()}<p class="small muted" style="margin:6px 0 0">${Math.round(min / 60)} h ${min % 60} min de entreno apuntadas en total.</p></div>`;
  out += `<div class="card"><h3>Historial</h3>${logs.length ? `<ul class="log">${logs.slice(0, 40).map(l => {
    const [w, t] = l.id.slice(1).split("-"), s = sesion(+w, t), T = TIPOS[t];
    const datos = [l.min ? `${l.min} min` : "", l.km ? `${l.km} km` : "", l.m ? `${l.m} m` : "", l.rpe ? `esfuerzo ${l.rpe}/10` : "", l.test ? `test ${mmss(l.test)}` : ""].filter(Boolean).join(" · ");
    return `<li><span class="dt">${l.fecha ? fechaCorta(fromIso(l.fecha)) : ""}</span><button class="sitem ${T.c}" style="padding:0;border:0" data-open="${l.id}"><span class="grow"><span class="tt" style="display:block">${s.title}</span><span class="ss">Sem. ${w} · ${datos || T.n}${l.nota ? " · " + esc(l.nota) : ""}</span></span></button></li>`;
  }).join("")}</ul>` : `<p class="empty">Aún no has registrado ninguna sesión. Cuando acabes una, pulsa «Marcar como hecha».</p>`}</div>`;
  return out;
}
function rachaSemanas() {
  const cur = Math.min(semanaDeFecha(hoy()), SEMANAS); let n = 0;
  const completa = w => sesionesSemana(w).every(s => hecho(s.id));
  let w = cur; if (w >= state.nivel && !completa(w)) w--;
  for (; w >= state.nivel; w--) { if (completa(w)) n++; else break; }
  return n;
}
function graficoTests() {
  const keys = ["row1k", "run1k", "sim"].filter(k => state.tests.some(t => t.k === k));
  if (!keys.length) return `<p class="empty">Tu primer test llega con el remo de la semana 1. Cada test que registres aparecerá aquí.</p>`;
  let out = "";
  for (const k of keys) {
    const pts = state.tests.filter(t => t.k === k).sort((a, b) => a.d.localeCompare(b.d) || a.ts - b.ts);
    const first = pts[0], last = pts[pts.length - 1], best = pts.reduce((a, b) => b.s < a.s ? b : a);
    const W = 320, H = 120, px = 34, py = 14;
    const ys = pts.map(p => p.s), lo = Math.min(...ys), hi = Math.max(...ys), span = Math.max(hi - lo, 10);
    const X = i => pts.length === 1 ? W / 2 : px + i * (W - px - 12) / (pts.length - 1);
    const Y = s => py + (s - (lo - span * .15)) / (span * 1.3) * (H - 2 * py);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.s).toFixed(1)}`).join("");
    const mejora = first.s - last.s;
    out += `<div style="margin-top:12px"><div class="row"><b class="grow" style="color:${TESTS[k].c}">${TESTS[k].n}</b><span class="small muted">Mejor: <b class="mono">${mmss(best.s)}</b></span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución ${TESTS[k].n}">
        <line x1="${px}" x2="${W - 8}" y1="${H - 4}" y2="${H - 4}" stroke="var(--line)"/>
        <text x="0" y="${Y(hi) + 4}">${mmss(hi)}</text>${hi !== lo ? `<text x="0" y="${Y(lo) + 4}">${mmss(lo)}</text>` : ""}
        <path d="${line}" fill="none" stroke="${TESTS[k].c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.s)}" r="4.5" fill="var(--paper)" stroke="${TESTS[k].c}" stroke-width="2.5"><title>${fechaCorta(fromIso(p.d))}: ${mmss(p.s)}</title></circle>`).join("")}
      </svg>
      <p class="small muted" style="margin:0">${pts.length} registro${pts.length > 1 ? "s" : ""} · último ${mmss(last.s)} (${fechaCorta(fromIso(last.d))})${pts.length > 1 ? ` · ${mejora > 0 ? `<b style="color:var(--ok)">${mmss(mejora)} más rápido</b> que el primero` : mejora < 0 ? `${mmss(-mejora)} más lento que el primero` : "igual que el primero"}` : ""}</p></div>`;
  }
  return out;
}
function graficoSemanas() {
  const n = state.dias.length, W = 320, H = 90, ws = [];
  for (let w = state.nivel; w <= SEMANAS; w++) ws.push(w);
  const bw = (W - 10) / ws.length, cur = semanaDeFecha(hoy());
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Sesiones hechas por semana">
    ${ws.map((w, i) => { const h = sesionesSemana(w).filter(s => hecho(s.id)).length, x = 5 + i * bw;
      return `<rect x="${x + 2}" y="10" width="${bw - 4}" height="${H - 10}" rx="3" fill="var(--soft)"/><rect x="${x + 2}" y="${H - (H - 10) * h / n}" width="${bw - 4}" height="${(H - 10) * h / n}" rx="3" fill="${h === n ? "var(--ok)" : "var(--acc)"}"><title>Semana ${w}: ${h}/${n}</title></rect>
      <text x="${x + bw / 2}" y="${H + 13}" text-anchor="middle" style="${w === cur ? "font-weight:700;fill:var(--ink)" : ""}">${w}</text>`; }).join("")}
  </svg>`;
}

function guardarRegistro(id, fd) {

function cerrarHoja() { $("#layer").innerHTML = ""; document.body.style.overflow = ""; }
let pilaHojas = [];

let toastT;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800); }

/* ---------- Temporizador ---------- */
let TM = null, actx = null, wake = null;
function beep(f = 880, dur = .15, vol = .25) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "square"; g.gain.value = vol; o.connect(g); g.connect(actx.destination); const t = actx.currentTime; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
function hablar(txt) { if (!state.voz || !("speechSynthesis" in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = "es-ES"; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {} }

function iniciarTimer(id) {
  const s = sesionPorId(id); if (!s) return;
  cerrarHoja(); pilaHojas = [];
  TM = { id, s, steps: s.steps, i: 0, t0: Date.now(), acc: 0, pausa: false, total0: Date.now(), last: -1, tick: null };
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
  pedirWake();
  entrarPaso();

}
function transcurrido() { return TM.acc + (TM.pausa ? 0 : (Date.now() - TM.t0) / 1000); }
function entrarPaso() {
  const p = TM.steps[TM.i]; TM.t0 = Date.now(); TM.acc = 0; TM.last = -1;
  beep(p.k === "rest" ? 660 : 990, .25);
  hablar(p.l + (p.s ? `, ${fmHabla(p.s)}` : ""));
  if (navigator.vibrate) try { navigator.vibrate(p.k === "rest" ? [120] : [200, 80, 200]); } catch (e) {}
  pintarTimer(true);
}
const fmHabla = s => { const m = Math.floor(s / 60), r = s % 60; return [m ? `${m} minuto${m > 1 ? "s" : ""}` : "", r ? `${r} segundos` : ""].filter(Boolean).join(" y "); };
function siguientePaso() { if (TM.i < TM.steps.length - 1) { TM.i++; entrarPaso(); } else terminarTimer(); }
function anteriorPaso() { if (transcurrido() > 3 || TM.i === 0) { TM.t0 = Date.now(); TM.acc = 0; pintarTimer(true); } else { TM.i--; entrarPaso(); } }
function pintarTimer(full) {
  if (!TM) return;
  const p = TM.steps[TM.i], el = transcurrido();
  if (p.s) {
    const rest = p.s - el;
    const sec = Math.ceil(rest);
    if (sec !== TM.last) { TM.last = sec; if (sec <= 3 && sec > 0 && !TM.pausa) beep(740, .1, .2); }
    if (rest <= 0 && !TM.pausa) { siguientePaso(); return; }
  }
  const sig = TM.steps[TM.i + 1];
  const kind = { work: "Trabajo", rest: "Descanso", prep: "Prepárate" }[p.k];
  const html = `<div class="timer k-${p.k}" role="dialog" aria-label="Temporizador">
    <div class="tm-top"><button class="icon-btn" id="tm-close" aria-label="Salir">${ICO.x}</button><span class="grow small" style="color:#b9bac0">${esc(TM.s.title)}</span><span class="mono small" style="color:#b9bac0">${TM.i + 1}/${TM.steps.length}</span></div>
    <div class="tm-mid">
      <span class="tm-kind">${kind}</span>
      <div class="tm-label">${esc(p.l)}</div>
      <div class="tm-clock" id="tm-clock">${p.s ? mmss(Math.ceil(p.s - el)) : mmss(el)}</div>
      <div class="tm-sub">${esc(p.sub || (p.s ? "" : "Cronómetro en marcha · toca «Siguiente» al terminar"))}</div>
      <div class="tm-bar"><i id="tm-bar" style="width:${p.s ? Math.min(100, el / p.s * 100) : 0}%"></i></div>
      <div class="tm-next">${sig ? `Después: <b>${esc(sig.l)}</b>${sig.s ? ` · ${fm(sig.s)}` : ""}` : "Último paso"}</div>
      <div class="small" style="color:#8d8e94;margin-top:6px">Tiempo total <span class="mono" id="tm-total">${mmss((Date.now() - TM.total0) / 1000)}</span></div>
    </div>
    <div class="tm-ctrl"><button class="btn" id="tm-prev">Atrás</button><button class="btn pri" id="tm-pp">${TM.pausa ? ICO.play + " Seguir" : ICO.pause + " Pausa"}</button><button class="btn" id="tm-next">${sig ? "Siguiente" : "Terminar"}</button></div>
  </div>`;
  let root = $("#timer-root");
  if (!root) { root = document.createElement("div"); root.id = "timer-root"; document.body.appendChild(root); }
  if (full || !$("#tm-clock")) { root.innerHTML = html; return; }
  $("#tm-clock").textContent = p.s ? mmss(Math.ceil(p.s - el)) : mmss(el);
  $("#tm-bar").style.width = (p.s ? Math.min(100, el / p.s * 100) : 0) + "%";

}
function pausar() { if (TM.pausa) { TM.t0 = Date.now(); TM.pausa = false; } else { TM.acc = transcurrido(); TM.pausa = true; } pintarTimer(true); }
function cerrarTimer() { if (!TM) return; clearInterval(TM.tick); TM = null; const r = $("#timer-root"); if (r) r.remove(); try { wake && wake.release(); } catch (e) {} wake = null; try { speechSynthesis.cancel(); } catch (e) {} }

  const id = TM.id, min = Math.round((Date.now() - TM.total0) / 60000);

  if (f.id === "f-test") { const s = parseT(fd.get("s")); if (!s) { toast("Escribe el tiempo como min:seg, por ejemplo 4:35"); return; } state.tests.push({ k: fd.get("k"), s, d: fd.get("d") || iso(hoy()), ts: Date.now() }); save(); cerrarHoja(); render(); toast("Test guardado."); }
  if (f.id === "f-ajustes") {
    const dias = [...f.querySelectorAll("[data-adia]")].filter(c => c.getAttribute("aria-pressed") === "true").map(c => +c.dataset.adia).sort();
    if (dias.length < 3 || dias.length > 5) { toast("Elige entre 3 y 5 días de entreno."); return; }
    state.nombre = String(fd.get("nombre") || "").trim(); state.dias = dias; state.nivel = +fd.get("nivel") || 1; state.voz = !!fd.get("voz");
    if (fd.get("inicio")) state.inicio = iso(lunesDe(fromIso(fd.get("inicio"))));
    save(); cerrarHoja(); render(); toast("Ajustes guardados.");
  }
});
// Recuerda qué sesión se está registrando (el formulario no lleva el id visible).
let sesionAbierta = null;
const _abrirRegistro = abrirRegistro;
abrirRegistro = function (id, pre) { sesionAbierta = id; _abrirRegistro(id, pre); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (TM) return; if (pilaHojas.length) volverHoja(); else cerrarHoja(); }
  if (TM && e.key === " ") { e.preventDefault(); pausar(); }
});
render();
</script>
