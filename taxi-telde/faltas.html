<style>

.luz.elegida { outline: 4px solid var(--ink); outline-offset: 2px; opacity: 1; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.fb.ok { background: var(--verde-soft); } .fb.ko { background: var(--rojo-soft); }
.fb b { font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.fb.ok b { color: var(--verde); } .fb.ko b { color: var(--rojo); }
.fb span { font-size: 15px; }
.fb small { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.fin h2 { margin: 0; font-family: var(--display); font-size: 30px; text-transform: uppercase; }

.nivel h3 small { font-family: var(--body); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 600; }

.nivel ul { list-style: none; margin: 0; padding: 4px 14px 8px; }
.nivel li { padding: 7px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 15px; }
.nivel li:last-child { border-bottom: 0; }
.nivel li small { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.nota { font-size: 14px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 10px 14px; }
@media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>

 la salida de otros taxis o entretenerse recogiendo prensa o charlando"}, {"q": "a", "n": "L", "a": "117.12", "t": "No avisar antes de las 09:00 de que no puedes hacer tu turno en el aeropuerto"}, {"q": "a", "n": "L", "a": "117.13", "t": "No acreditar con documentos los permisos autorizados"}, {"q": "a", "n": "G", "a": "118.1", "t": "Engañar al apuntador o cargar saltándose el turno"}, {"q": "a", "n": "G", "a": "118.2", "t": "Recoger en Llegadas para llevar a Salidas, o recoger en paradas de guagua, aparcamientos o túneles"}, {"q": "a", "n": "G", "a": "118.3", "t": "Estar en el aeropuerto sin estar de turno ese día, salvo para dejar pasajeros"}, {"q": "a", "n": "G", "a": "118.4", "t": "No respetar los turnos o hacer cambios de turno"}, {"q": "a", "n": "G", "a": "118.5", "t": "Tocar el claxon sin motivo, lavar o limpiar el coche, decir palabras soeces o discutir a voces"}, {"q": "a", "n": "G", "a": "118.6", "t": "Hacer servicios con acompañante o con un conductor en prácticas"}, {"q": "a", "n": "G", "a": "118.7", "t": "No someterse a la toma de kilometraje del apuntador"}, {"q": "a", "n": "G", "a": "118.8", "t": "Ofrecer servicios dentro del recinto o abandonar el vehículo sin fuerza mayor"}, {"q": "a", "n": "G", "a": "118.9", "t": "Hacer servicios de agencias sin estar autorizado"}, {"q": "a", "n": "M", "a": "119.1", "t": "Alterar el cuentakilómetros con cualquier dispositivo"}, {"q": "a", "n": "M", "a": "119.2", "t": "Insultos, agresiones, lesiones o amenazas en las que esté implicado un taxista"}];
const NIV = { L: "Leve", G: "Grave", M: "Muy grave" };
const CLS = { L: "l", G: "g", M: "m" };
const QUIEN = { t: "Titular de la licencia", c: "Conductor", a: "En el aeropuerto" };
const SAN = {
  L: "Multa hasta 400 € (o apercibimiento) · suspensión hasta 1 mes",
  G: "Multa de 401 a 2.000 € · suspensión de 1 mes y 1 día a 3 meses",
  M: "Multa de 2.001 a 6.000 € · suspensión de 3 meses y 1 día a 1 año",
};
const SANA = { L: "Exclusión del aeropuerto hasta 15 días", G: "Exclusión de 16 días a 3 meses", M: "Exclusión de 3 meses y 1 día a 6 meses" };
const KEY = "semaforo-faltas-v1";
let sabidas = {}; try { sabidas = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { sabidas = {}; }
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(sabidas)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const id = f => f.q + f.a;
function mezclar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let vista = "jugar", filtro = "todas", cola = [], actual = null, resp = null, aciertos = 0, hechas = 0, fallada = new Set();
function lote() {
  const base = F.filter(f => filtro === "todas" || f.q === filtro);
  const pend = base.filter(f => !sabidas[id(f)]);
  return mezclar(pend.length ? pend : base).slice(0, 15);
}
function nuevaRonda() { cola = lote(); fallada = new Set(); aciertos = 0; hechas = 0; actual = cola.shift() || null; resp = null; pintar(); }

function pintarJugar() {
  const base = F.filter(f => filtro === "todas" || f.q === filtro);
  const n = base.filter(f => sabidas[id(f)]).length;
  const filtros = [["todas", "Todas"], ["c", "Conductor"], ["t", "Titular"], ["a", "Aeropuerto"]];
  let h = `<div class="filtros">${filtros.map(([k, v]) => `<button class="chip" data-f="${k}" aria-pressed="${filtro === k}">${v}</button>`).join("")}</div>
  <div class="barra"><div class="txt"><span>Te sabes <b>${n}</b> de ${base.length} faltas</span><span>Ronda: ${aciertos}/${hechas}</span></div><div class="track"><i style="width:${base.length ? n * 100 / base.length : 0}%"></i></div></div>`;
  if (!actual) {
    h += `<div class="fin"><h2>${n === base.length ? "¡Te las sabes todas! 🎉" : "¡Ronda terminada!"}</h2>
      <p>${hechas ? `Has acertado ${aciertos} de ${hechas}.` : ""} ${n === base.length ? "Puedes seguir repasando para que no se olviden." : `Te quedan ${base.length - n} por aprender.`}</p>
      <button class="sig" data-a="otra">Otra ronda de 15</button>
      ${n ? `<button class="mini" data-a="reset">Empezar de cero</button>` : ""}</div>`;
    return h;
  }
  const f = actual;
  h += `<div class="tarjeta"><span class="quien">${QUIEN[f.q]}</span><div class="falta">${esc(f.t)}</div>${resp ? "" : `<span class="pista">¿Leve, grave o muy grave?</span>`}</div>
  <div class="luces">${["L", "G", "M"].map(k => `<button class="luz ${CLS[k]} ${resp === k ? "elegida" : ""}" data-n="${k}" ${resp ? "disabled" : ""}><span></span>${NIV[k]}</button>`).join("")}</div>`;
  if (resp) {
    const ok = resp === f.n;
    h += `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? "¡Bien! " : "Es "}${NIV[f.n]}</b><span>${f.q === "a" ? SANA[f.n] : SAN[f.n]}</span><small>Art. ${f.a}</small>${ok ? "" : `<span>Te la vuelvo a preguntar en esta ronda.</span>`}</div>
    <button class="sig" data-a="sig">Siguiente →</button>`;
  }
  return h;
}
function pintarLista() {
  const q = (document.getElementById("buscar") || {}).value || "";
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const nq = norm(q);
  let h = `<input class="buscar" id="buscar" type="search" placeholder="Buscar una falta (taxímetro, recibo, uniforme…)" value="${esc(q)}">`;
  for (const w of ["c", "t", "a"]) {
    const grupo = F.filter(f => f.q === w && (!nq || norm(f.t).includes(nq)));
    if (!grupo.length) continue;
    h += `<section class="grupo"><h2>${QUIEN[w]}</h2>`;
    for (const k of ["L", "G", "M"]) {
      const it = grupo.filter(f => f.n === k); if (!it.length) continue;
      h += `<div class="nivel ${CLS[k]}"><h3>${NIV[k]} <small>${w === "a" ? SANA[k] : SAN[k].split(" · ")[0]}</small></h3><ul>${it.map(f => `<li><span>${sabidas[id(f)] ? "✓ " : ""}${esc(f.t)}</span><small>${f.a}</small></li>`).join("")}</ul></div>`;
    }
    h += `</section>`;
  }
  h += `<p class="nota"><b>Reglas generales.</b> Lo que vulnera la Ordenanza y no está en la lista es leve (o muy grave si por sus circunstancias lo merece, justificándolo). <b>Reincidir sube un nivel:</b> si ya te sancionaron por lo mismo en los 12 meses anteriores (6 meses en el aeropuerto), una leve pasa a grave y una grave a muy grave. En el aeropuerto, las agresiones con sentencia judicial cuentan como grave.</p>`;
  return h;
}
function pintar() {
  document.getElementById("t-jugar").setAttribute("aria-selected", vista === "jugar");
  document.getElementById("t-lista").setAttribute("aria-selected", vista === "lista");
  const foco = document.activeElement && document.activeElement.id === "buscar";
  const app = document.getElementById("app");
  app.innerHTML = vista === "jugar" ? pintarJugar() : pintarLista();
  if (foco) { const b = document.getElementById("buscar"); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "t-jugar") { vista = "jugar"; pintar(); }
  else if (t.id === "t-lista") { vista = "lista"; pintar(); }
  else if (t.dataset.f) { filtro = t.dataset.f; nuevaRonda(); }
  else if (t.dataset.n && actual && !resp) {
    resp = t.dataset.n; hechas++;
    if (resp === actual.n) { aciertos++; if (!fallada.has(id(actual))) { sabidas[id(actual)] = 1; guardar(); } }
    else { fallada.add(id(actual)); delete sabidas[id(actual)]; guardar(); cola.splice(Math.min(cola.length, 3), 0, actual); }
    pintar();
  }
  else if (t.dataset.a === "sig") { actual = cola.shift() || null; resp = null; pintar(); window.scrollTo({ top: 0 }); }
  else if (t.dataset.a === "otra") nuevaRonda();
  else if (t.dataset.a === "reset") { sabidas = {}; guardar(); nuevaRonda(); }
});
document.addEventListener("input", e => { if (e.target.id === "buscar") pintar(); });
nuevaRonda();
</script>
