<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Intro Halloween 5mentarios</title>
<link href="../2026-09-25-musica-en-directo/fonts/fonts.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .canvas { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #030504; }
  .abs { position: absolute; inset: 0; }
  .light { background: radial-gradient(700px 800px at 50% 44%, rgba(70,160,90,.35), rgba(20,40,25,.15) 50%, transparent 75%); }
  .fog { position: absolute; left: -20%; width: 140%; height: 900px; opacity: .55; mix-blend-mode: screen; filter: blur(30px); }
  .stage { position: absolute; left: 50%; top: 44%; width: 860px; height: 863px; transform: translate(-50%, -50%); }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ghost { mix-blend-mode: screen; }
  .title { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; }
  .title .h { font-family: "Creepster", cursive; font-size: 200px; line-height: 1; color: #b3000c; letter-spacing: .03em;
    text-shadow: 0 0 20px rgba(255,0,20,.55), 0 10px 30px rgba(0,0,0,.9); }
  .title .s { margin-top: 30px; font-family: "Bebas Neue", sans-serif; font-size: 58px; letter-spacing: .5em; padding-left: .5em; color: #cfe9c9; opacity: .9; }
  .flash { background: #eaffef; mix-blend-mode: screen; }
  .vig { background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.85) 85%); }
  svg.fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grain { mix-blend-mode: overlay; opacity: .55; }
  .scan { background: repeating-linear-gradient(180deg, rgba(0,0,0,.18) 0 2px, transparent 2px 5px); mix-blend-mode: multiply; }
</style>
</head>
<body>
<div class="canvas">
  <div class="abs light" id="light"></div>
  <svg class="fog" id="fog1" style="top: 700px" xmlns="http://www.w3.org/2000/svg"><filter id="f1"><feTurbulence type="fractalNoise" baseFrequency=".004 .012" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .6  0 0 0 0 .75  0 0 0 0 .65  0 0 0 1.4 -.55"/></filter><rect width="100%" height="100%" filter="url(#f1)"/></svg>
  <svg class="fog" id="fog2" style="top: 1250px" xmlns="http://www.w3.org/2000/svg"><filter id="f2"><feTurbulence type="fractalNoise" baseFrequency=".003 .01" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .7  0 0 0 0 .6  0 0 0 1.5 -.5"/></filter><rect width="100%" height="100%" filter="url(#f2)"/></svg>

  <div class="stage" id="stage">
    <img class="ghost" id="gR" src="capa-logo.png" alt="">
    <img class="ghost" id="gG" src="capa-logo.png" alt="">
    <img id="blood" src="capa-sangre.png" alt="">
    <img id="logo" src="capa-logo.png" alt="">
  </div>

  <div class="title" id="title"><div class="h">HALLOWEEN</div><div class="s">5MENTARIOS</div></div>
  <svg class="fx" id="embers" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="abs flash" id="flash"></div>
  <div class="abs scan"></div>
  <div class="abs vig"></div>
  <svg class="fx grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence id="gt" type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</div>
<script>
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const $ = id => document.getElementById(id);
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  // parpadeo tipo bombilla estropeada, determinista
  const flickTable = Array.from({ length: 400 }, () => rnd());
  const flick = t => flickTable[Math.floor(t * 24) % 400];

  // partículas (ascuas / polvo)
  const emb = Array.from({ length: 50 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: .8 + rnd() * 2.6, v: 20 + rnd() * 60, ph: rnd() * 6.28, o: .2 + rnd() * .6 }));
  const E = $("embers");

  window.setT = t => {
    // luz y niebla
    let lvl;
    if (t < 0.6) lvl = 0;
    else if (t < 2.8) lvl = flick(t) > .55 ? (flick(t + .3) > .5 ? 1 : .5) : .05;
    else lvl = .85 + .15 * Math.sin(t * 13) * (flick(t) > .9 ? 1 : .2);
    $("light").style.opacity = lvl;
    $("fog1").style.transform = `translateX(${-60 + t * 25}px)`;
    $("fog2").style.transform = `translateX(${40 - t * 32}px)`;
    $("fog1").style.opacity = .35 + .25 * Math.min(1, t / 2);

    // logo: aparece a golpes de luz con fallo de imagen
    const logo = $("logo"), gR = $("gR"), gG = $("gG");
    const vis = t < 0.6 ? 0 : t < 2.8 ? lvl : 1;
    logo.style.opacity = vis;
    const glitch = (t > 0.6 && t < 3.0 && flick(t + .7) > .7) || (t > 4.05 && t < 4.35);
    const gx = glitch ? (flick(t + 1) - .5) * 40 : 0;
    gR.style.opacity = glitch ? .7 * vis : 0; gG.style.opacity = glitch ? .6 * vis : 0;
    gR.style.transform = `translate(${gx}px, 0)`; gG.style.transform = `translate(${-gx}px, ${gx * .3}px)`;
    gR.style.filter = "sepia(1) saturate(8) hue-rotate(-50deg)"; gG.style.filter = "sepia(1) saturate(6) hue-rotate(60deg)";
    const s = 1 + .03 * Math.sin(t * 1.3) + (t > 4.05 && t < 4.3 ? .04 : 0);
    const shakeX = glitch ? (flick(t + 2) - .5) * 14 : 0;
    $("stage").style.transform = `translate(calc(-50% + ${shakeX}px), -50%) scale(${s})`;

    // sangre que gotea: se revela de arriba abajo
    const b = ease((t - 2.9) / 2.2);
    const blood = $("blood");
    blood.style.opacity = t > 2.9 ? vis : 0;
    blood.style.clipPath = `inset(0 0 ${100 - (62 + 38 * b)}% 0)`;

    // relámpago
    const f = t > 4.0 && t < 4.5 ? Math.max(0, 1 - Math.abs(t - 4.08) * 10) + Math.max(0, .6 - Math.abs(t - 4.3) * 8) : 0;
    $("flash").style.opacity = f * .8;

    // título
    const k = ease((t - 4.2) / .6);
    const title = $("title");
    title.style.opacity = k * (t > 4.2 && t < 5 && flick(t + 3) > .8 ? .4 : 1);
    title.style.transform = `translateY(${(1 - k) * 60}px) scale(${1.15 - .15 * k})`;
    title.querySelector(".h").style.transform = `translateX(${t > 4.2 && t < 5.2 ? (flick(t + 5) - .5) * 10 : 0}px)`;

    // partículas
    let e = "";
    for (const p of emb) {
      const y = ((p.y - p.v * t * 3) % 1920 + 1920) % 1920;
      e += `<circle cx="${p.x + Math.sin(t + p.ph) * 20}" cy="${y}" r="${p.r}" fill="#9dff9f" opacity="${p.o * (.3 + .7 * vis)}"/>`;
    }
    E.innerHTML = e;
    $("gt").setAttribute("seed", 1 + Math.floor(t * 30) % 24);
  };
  setT(0);
</script>
</body>
</html>
