  // luz fría que falla 1.3-3.1
  let cold=0; if(t>1.3&&t<3.1) cold = fl(t)>.5 ? (fl(t+.4)>.4?1:.4) : 0; if(t>=3.3) cold=.25+.1*fl(t);
  $("cold").style.opacity=cold;
  const red = t<3.3?0: ease((t-3.3)/.8)*(.85+.15*Math.sin(t*2.2));
  $("under").style.opacity=red;
  const vis = t<1.3?0 : t<3.1? cold : Math.max(cold*1.2, red);
  $("logo").style.opacity=Math.min(1,vis*1.1);
  const push=1+ (t>3.3? (t-3.3)*.018:0);
  const shake = (t>3.05&&t<3.2)||(t>5.95&&t<6.25) ? (fl(t+2)-.5)*26 : 0;
  $("stage").style.transform=`translate(calc(-50% + ${shake}px), calc(-50% + ${shake*.4}px)) scale(${push})`;
  $("fog1").style.opacity=.55*Math.min(1,vis*1.3); $("fog2").style.opacity=.4*Math.min(1,vis*1.3);
  $("fog1").style.transform=`translateX(${t*30}px)`; $("fog2").style.transform=`translateX(${-t*40}px)`;
  // sangre
  ctx.clearRect(0,0,1080,1920);
  ctx.save(); ctx.translate(540,1920*.40); ctx.scale(push,push); ctx.translate(-540,-1920*.40);
  if(t>3.3){ ctx.globalAlpha=Math.min(1,vis*1.2); drips.forEach(d=>drawDrip(d,t,1));
    fall.forEach(d=>{ if(t>d.t1){ const tt=t-d.t1; const y=d.y+d.L+ 900*tt*tt; if(y<1920){ctx.fillStyle="#8a0008"; ctx.beginPath(); ctx.ellipse(d.x,y,d.w*.9,d.w*1.6,0,0,6.3); ctx.fill();}}}); }
  ctx.restore();
  // título
  const kt=ease((t-6.0)/.35);
  const title=$("title"); title.style.opacity = t<6?0: kt*(t<6.8 && fl(t+3)>.75 ? .3:1);
  title.style.transform=`scale(${1.35-.35*kt}) translateX(${t>6&&t<6.4?(fl(t+5)-.5)*20:0}px)`;
  if(t>6.3){ ctx.globalAlpha=1; tdrips.forEach(d=>drawDrip(d,t,1)); }
  // relámpagos
  const f = (t>5.95&&t<6.4) ? Math.max(Math.max(0,1-Math.abs(t-6.0)*14), .7*Math.max(0,1-Math.abs(t-6.2)*12)) : 0;
  $("flash").style.opacity=f*.9;
  // cortes a negro
  let bk = 0; if(t>=3.1&&t<3.3) bk=1; if(t>8.4) bk=ease((t-8.4)/.5);
  $("black").style.opacity=bk;
};
setT(0);
</script></body></html>
