<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>España vs Croacia en 5mentarios</title>
<link href="../../2026-09-25-musica-en-directo/fonts/fonts.css" rel="stylesheet">
<style>
  :root { --mint: #bfe8cf; --green: #1f9a55; --H: 1920px; --s: 1; }
  body.post { --H: 1350px; --s: .74; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .canvas { width: 1080px; height: var(--H); position: relative; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
    background: #020805 url(fondo-partido-editada.jpg) center 30% / cover no-repeat; }
  body.post .canvas { background-position: center 34%; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.05) 14%, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 44%, rgba(2,12,6,.93) 58%, #020a05 100%); }
  body.post .shade { background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,.05) 14%, rgba(0,0,0,0) 22%, rgba(0,0,0,.6) 36%, rgba(2,12,6,.95) 50%, #020a05 100%); }
  svg.grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .4; pointer-events: none; z-index: 30; }
  .logo { position: absolute; top: calc(46px * var(--s)); left: 50%; width: calc(150px * var(--s)); transform: translateX(-50%); z-index: 5; filter: drop-shadow(0 8px 20px rgba(0,0,0,.6)); }
  .live { position: absolute; top: calc(66px * var(--s)); right: 46px; z-index: 5; display: flex; align-items: center; gap: 10px;
    font-family: "Bebas Neue", sans-serif; font-size: calc(34px * var(--s)); letter-spacing: .12em; line-height: 1;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); padding: 9px 16px 5px; border-radius: 6px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: #e3242b; box-shadow: 0 0 12px #e3242b; margin-top: -3px; }
  .block { position: absolute; left: 0; right: 0; bottom: calc(80px * var(--s)); z-index: 5; text-align: center; }
  .kicker { display: inline-flex; align-items: center; gap: 16px; font-family: "Bebas Neue", sans-serif; font-size: calc(40px * var(--s)); letter-spacing: .24em; color: var(--mint); }
  .kicker::before, .kicker::after { content: ""; width: 60px; height: 2px; background: currentColor; }
  .match { display: flex; align-items: flex-start; justify-content: center; gap: calc(30px * var(--s)); margin-top: calc(40px * var(--s)); }
  .team { width: calc(330px * var(--s)); display: flex; flex-direction: column; align-items: center; }
  .badge { width: calc(230px * var(--s)); height: calc(230px * var(--s)); border-radius: 50%; overflow: hidden; position: relative;
    box-shadow: 0 0 0 calc(8px * var(--s)) #fff, 0 0 0 calc(14px * var(--s)) rgba(255,255,255,.22), 0 20px 50px rgba(0,0,0,.7); }
  .badge svg { width: 100%; height: 100%; display: block; }
  .badge::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 32% 25%, rgba(255,255,255,.45), transparent 45%), radial-gradient(circle, transparent 60%, rgba(0,0,0,.35)); }
  .tname { margin-top: calc(36px * var(--s)); font-family: "Anton", sans-serif; font-size: calc(84px * var(--s)); line-height: 1; letter-spacing: .02em; text-shadow: 0 6px 24px rgba(0,0,0,.7); }
  .vs { margin-top: calc(63px * var(--s)); width: calc(104px * var(--s)); height: calc(104px * var(--s)); border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; background: var(--green);
    font-family: "Anton", sans-serif; font-size: calc(46px * var(--s)); box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 40px rgba(31,154,85,.7); }
  .when { margin-top: calc(56px * var(--s)); display: inline-flex; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.6);
    font-family: "Bebas Neue", sans-serif; line-height: 1; font-size: calc(92px * var(--s)); }
  .when .d { background: var(--green); color: #fff; padding: calc(18px * var(--s)) calc(34px * var(--s)) calc(8px * var(--s)); letter-spacing: .04em; }
  .when .h { background: #fff; color: #0a3d1f; padding: calc(18px * var(--s)) calc(38px * var(--s)) calc(8px * var(--s)); }
  .where { margin-top: calc(30px * var(--s)); font-family: "Bebas Neue", sans-serif; font-size: calc(60px * var(--s)); letter-spacing: .06em; }
  .where b { color: #3ec872; font-weight: 400; }
  .perks { margin-top: calc(12px * var(--s)); font-weight: 700; font-size: calc(25px * var(--s)); letter-spacing: .16em; color: rgba(255,255,255,.8); }
  .intro { position: absolute; inset: 0; z-index: 20; background: radial-gradient(circle at 50% 45%, #0e5a2e, #03170b 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .intro .a { font-family: "Bebas Neue", sans-serif; font-size: 120px; letter-spacing: .12em; color: var(--mint); line-height: 1; }
  .intro .b { font-family: "Anton", sans-serif; font-size: 250px; line-height: .95; }
  .intro .bar { width: 0; height: 18px; margin-top: 26px; background: linear-gradient(180deg, #c60b1e 0 25%, #ffc400 25% 75%, #c60b1e 75%); }
  .sweep { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(105deg, transparent 40%, rgba(180,255,200,.09) 50%, transparent 60%); }
  .spark { position: absolute; left: 50%; width: 10px; height: 10px; z-index: 6; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff, rgba(120,255,160,.6) 40%, transparent 70%); transform: translate(-50%,-50%); }
  .crest { height: 440px; width: auto; max-width: 400px; object-fit: contain; display: block;
    filter: drop-shadow(0 0 30px rgba(255,255,255,.18)) drop-shadow(0 26px 40px rgba(0,0,0,.85)); }
  .team { width: 420px !important; height: 560px; justify-content: flex-end; }
  .match { align-items: center !important; gap: 10px !important; }
  .vs { margin-top: -110px !important; }
  .tname { margin-top: 30px !important; }
  .block { bottom: 150px !important; }
  .when { margin-top: 70px !important; }
  .shade { background: linear-gradient(180deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.25) 14%, rgba(0,0,0,.45) 30%, rgba(2,12,6,.82) 42%, rgba(2,12,6,.9) 70%, #020a05 100%) !important; }
</style>
</head>
<body>
<div class="canvas">
  <div class="shade"></div>
  <div class="sweep" id="sweep"></div>
  <img class="logo" src="../../2026-09-25-musica-en-directo/logo/5mentarios-original.png" alt="5mentarios">
  <div class="live"><i></i>EN DIRECTO</div>
  <div class="block">
    <div><span class="kicker">JUEGA LA SELECCIÓN</span></div>
    <div class="match">
      <div class="team">
        <img class="crest" src="escudos/espana-rfef.png" alt="España">
        <div class="tname">ESPAÑA</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <img class="crest" src="escudos/croacia-hns.png" alt="Croacia">
        <div class="tname">CROACIA</div>
      </div>
    </div>
    <div class="when"><span class="d">HOY</span><span class="h">19:45</span></div>
    <div class="where">EN DIRECTO EN <b>5MENTARIOS</b></div>
    <div class="perks">PANTALLAS · TERRAZA · HEINEKEN BIEN FRÍA</div>
  </div>
  <div class="spark" id="spark"></div>
  <div class="intro" id="intro"><div class="a" id="ia">HOY JUEGA</div><div class="b" id="ib">ESPAÑA</div><div class="bar" id="ibar"></div></div>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("f") === "post") document.body.classList.add("post");
  if (q.get("d")) document.querySelector(".when .d").textContent = q.get("d");
  const $ = s => document.querySelector(s);
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const back = x => { if (x <= 0) return 0; if (x >= 1) return 1; const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const teams = [...document.querySelectorAll(".team")], badges = [...document.querySelectorAll(".crest")], names = [...document.querySelectorAll(".tname")];
  const canvas = $(".canvas");
  window.setT = t => {
    // intro 0-1.8
    const ia = ease(t / .35), ib = back((t - .25) / .5);
    $("#ia").style.opacity = ia; $("#ia").style.transform = `translateY(${(1 - ia) * 40}px)`;
    $("#ib").style.opacity = ease((t - .25) / .25); $("#ib").style.transform = `scale(${2.2 - 1.2 * ib})`;
    $("#ibar").style.width = ease((t - .6) / .5) * 640 + "px";
    const out = ease((t - 1.6) / .45);
    $("#intro").style.clipPath = `inset(0 0 ${out * 100}% 0)`;
    $("#intro").style.display = out >= 1 ? "none" : "flex";
    // fondo: zoom lento y barrido de luz
    const z = 112 - Math.min(10, Math.max(0, t - 1.6) * 1.4); canvas.style.backgroundSize = `${z}% ${z}%`;
    $("#sweep").style.transform = `translateX(${-120 + ((t * 45) % 240)}%)`;
    // logo y en directo
    const kl = ease((t - 1.9) / .5);
    $(".logo").style.opacity = kl; $(".logo").style.transform = `translateX(-50%) translateY(${(1 - kl) * -30}px)`;
    $(".live").style.opacity = ease((t - 2.1) / .4); $(".live i").style.opacity = Math.sin(t * 7) > 0 ? 1 : .25;
    $(".kicker").style.opacity = ease((t - 2.1) / .4);
    // insignias: entran desde los lados girando
    teams.forEach((tm, i) => {
      const k = back((t - 2.3 - i * .12) / .7), dir = i ? 1 : -1;
      badges[i].style.transform = `translateX(${dir * (1 - k) * 700}px) rotate(${dir * (1 - k) * 540}deg) scale(${1 + (t > 3 && t < 3.25 ? .06 : 0)})`;
      badges[i].style.opacity = ease((t - 2.3 - i * .12) / .3);
      const kn = ease((t - 3.1 - i * .1) / .4);
      names[i].style.opacity = kn; names[i].style.transform = `translateY(${(1 - kn) * 30}px)`;
    });
    // VS con destello
    const kv = back((t - 2.95) / .45);
    $(".vs").style.opacity = ease((t - 2.95) / .2); $(".vs").style.transform = `scale(${kv * (1 + .05 * Math.sin(t * 5))})`;
    const sp = t > 2.95 && t < 3.5 ? 1 - (t - 2.95) / .55 : 0;
    const vsr = $(".vs").getBoundingClientRect(), cr = canvas.getBoundingClientRect();
    $("#spark").style.top = (vsr.top - cr.top + vsr.height / 2) + "px";
    $("#spark").style.width = $("#spark").style.height = (40 + (1 - sp) * 900) + "px";
    $("#spark").style.opacity = sp;
    // hora y textos
    const kw = back((t - 3.6) / .5);
    $(".when").style.opacity = ease((t - 3.6) / .25); $(".when").style.transform = `scale(${kw})`;
    $(".when .h").style.transform = t > 4.5 ? `scale(${1 + .04 * Math.max(0, Math.sin((t - 4.5) * 4))})` : "none";
    const kr = ease((t - 4.1) / .4), kp = ease((t - 4.35) / .4);
    $(".where").style.opacity = kr; $(".where").style.transform = `translateY(${(1 - kr) * 25}px)`;
    $(".perks").style.opacity = kp; $(".perks").style.transform = `translateY(${(1 - kp) * 20}px)`;
    $("#g feTurbulence").setAttribute("seed", 1 + Math.floor(t * 24) % 20);
  };
  setT(0);
</script>
</body>
</html>
