<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Weekend at 5mentarios</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --paper: #f1e6cf;
    --green: #0b7a3a;
    --ink: #14180f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .canvas {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Inter", sans-serif;
  }
  svg.grain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }

  /* cabecera */
  .kicker { position: absolute; top: 96px; left: 0; right: 0; display: flex; justify-content: center; align-items: baseline; gap: 44px; }
  .script { font-family: "Mrs Saint Delafield", cursive; font-size: 104px; line-height: .6; color: var(--ink); transform: translateY(8px); padding-right: 40px; }
  .kicker b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 76px; line-height: 1; letter-spacing: .01em; }
  .title {
    position: absolute; top: 172px; left: 0; right: 0; text-align: center;
    font-family: "Anton", sans-serif; font-size: 206px; line-height: 1; color: var(--green);
    letter-spacing: -.005em;
  }

  /* noches */
  .block { position: absolute; left: 56px; right: 56px; background: var(--green); }
  .fig { position: absolute; z-index: 3; }
  .strip {
    position: absolute; left: 56px; right: 56px; height: 176px; z-index: 4;
    border: 3px solid var(--green); background: var(--paper);
    display: grid; grid-template-columns: 110px 1fr 1fr; align-items: center;
  }
  .strip .day {
    height: 100%; background: var(--green); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: "Anton", sans-serif; font-size: 36px; letter-spacing: .04em;
    writing-mode: vertical-rl; transform: rotate(180deg);
  }
  .act { text-align: center; }
  .act .name { font-family: "Anton", sans-serif; font-size: 84px; line-height: 1; color: var(--green); letter-spacing: -.005em; }
  .act .time { font-family: "Anton", sans-serif; font-size: 40px; line-height: 1; margin-top: 10px; color: var(--ink); letter-spacing: .04em; }
  .act + .act { border-left: 2px solid rgba(11,122,58,.35); }

  /* logos */
  .logos { position: absolute; left: 0; right: 0; bottom: 70px; display: flex; justify-content: center; gap: 36px; }
  .slot {
    width: 250px; height: 96px; border: 2px dashed rgba(20,24,15,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: .16em; color: rgba(20,24,15,.45);
  }
  body.clean .slot { border-color: transparent; color: transparent; }
</style>
</head>
<body>
<div class="canvas">
  <div class="kicker"><span class="script">Weekend at</span><b>HEINEKEN</b></div>
  <div class="title">5MENTARIOS</div>

  <!-- FRIDAY -->
  <div class="block" style="top: 520px; height: 380px;"></div>
  <img class="fig" src="print/son-karibe.png" style="left: 70px; bottom: calc(1920px - 900px); height: 520px;" alt="">
  <img class="fig" src="print/dj-ake.png" style="right: 62px; bottom: calc(1920px - 900px); height: 480px;" alt="">
  <div class="strip" style="top: 900px;">
    <div class="day">FRIDAY</div>
    <div class="act"><div class="name">SON KARIBE</div><div class="time">22:30</div></div>
    <div class="act"><div class="name">DJ AKE</div><div class="time">00:00</div></div>
  </div>

  <!-- SATURDAY -->
  <div class="block" style="top: 1176px; height: 380px;"></div>
  <img class="fig" src="print/son-aldra.png" style="left: 64px; bottom: calc(1920px - 1556px); height: 400px;" alt="">
  <img class="fig" src="print/dj-asped.png" style="right: 56px; bottom: calc(1920px - 1556px); height: 470px;" alt="">
  <div class="strip" style="top: 1556px;">
    <div class="day">SATURDAY</div>
    <div class="act"><div class="name">SON ALDRA</div><div class="time">22:30</div></div>
    <div class="act"><div class="name">DJ ASPED</div><div class="time">00:00</div></div>
  </div>

  <div class="logos"><div class="slot">LOGO 5MENTARIOS</div><div class="slot">LOGO HEINEKEN</div></div>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 -1.6 1.1"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>
</div>
<script>
  if (new URLSearchParams(location.search).get("logos") === "0") document.body.classList.add("clean");
</script>
</body>
</html>
