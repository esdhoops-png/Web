<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fin de semana en directo</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --navy: #0b1a33;
    --navy-2: #13294d;
    --gold: #d9b56a;
    --gold-soft: #f1dca8;
    --ink: #f6f1e6;
    --w: 1080px;
    --h: 1350px;
  }
  body.story { --h: 1920px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .canvas {
    width: var(--w);
    height: var(--h);
    position: relative;
    overflow: hidden;
    color: var(--ink);
    font-family: "Inter", sans-serif;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(217,181,106,.22), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(40,90,170,.35), transparent 60%),
      linear-gradient(180deg, var(--navy-2), var(--navy) 55%, #060e1d);
    display: flex;
    flex-direction: column;
    padding: 64px 64px 56px;
  }
  /* líneas doradas decorativas */
  .canvas::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-radial-gradient(circle at 110% 50%, transparent 0 38px, rgba(217,181,106,.07) 39px 40px);
    pointer-events: none;
  }
  header { position: relative; text-align: center; }
  .kicker {
    display: inline-flex; align-items: center; gap: 18px;
    font-weight: 800; letter-spacing: .32em; text-transform: uppercase;
    font-size: 24px; color: var(--gold);
  }
  .kicker::before, .kicker::after { content: ""; width: 70px; height: 2px; background: var(--gold); }
  h1 {
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: 120px;
    line-height: .95;
    text-transform: uppercase;
    margin-top: 18px;
    letter-spacing: .01em;
  }
  h1 em {
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 600;
    text-transform: none;
    color: var(--gold);
    font-size: .62em;
    display: block;
    margin-bottom: 22px;
  }
  .nights {
    position: relative;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 34px;
    margin-top: 44px;
  }
  .night { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .day {
    display: flex; align-items: baseline; gap: 18px;
    margin-bottom: 16px;
  }
  .day b {
    font-family: "Anton", sans-serif; font-weight: 400;
    font-size: 58px; text-transform: uppercase; line-height: 1;
  }
  .day span {
    font-weight: 700; font-size: 26px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold);
  }
  .day i { flex: 1; height: 2px; background: linear-gradient(90deg, rgba(217,181,106,.7), transparent); align-self: center; }
  .acts { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; min-height: 0; }
  .act {
    position: relative; border-radius: 22px; overflow: hidden;
    border: 2px solid rgba(217,181,106,.55);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .act img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .act::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(6,14,29,.92) 92%);
  }
  .act .info { position: absolute; left: 24px; right: 24px; bottom: 20px; z-index: 1; }
  .time {
    display: inline-block;
    background: var(--gold); color: var(--navy);
    font-weight: 800; font-size: 24px; letter-spacing: .06em;
    padding: 6px 14px; border-radius: 999px;
  }
  .name {
    font-family: "Anton", sans-serif; font-weight: 400;
    font-size: 54px; line-height: 1; text-transform: uppercase;
    margin-top: 10px;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  .role { font-weight: 700; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-soft); margin-top: 6px; }
  footer {
    position: relative;
    margin-top: 36px;
    text-align: center;
    font-weight: 800; font-size: 26px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--gold-soft);
  }
  footer small { display: block; font-weight: 500; letter-spacing: .08em; text-transform: none; font-size: 22px; color: rgba(246,241,230,.7); margin-top: 8px; }

  body.story .canvas { padding: 120px 64px 110px; }
  body.story h1 { font-size: 124px; white-space: nowrap; }
  body.story h1 em { margin-bottom: 40px; }
  body.story .nights { gap: 48px; margin-top: 64px; }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <div class="kicker">Música en directo</div>
    <h1><em>Este fin de semana</em>Viernes &amp; Sábado</h1>
  </header>

  <section class="nights">
    <div class="night">
      <div class="day"><b>Viernes</b><span>25 sep</span><i></i></div>
      <div class="acts">
        <div class="act">
          <img src="img/son-karibe.jpg" style="object-position: 45% 25%" alt="Son Karibe">
          <div class="info"><span class="time">22:30 h</span><div class="name">Son Karibe</div><div class="role">En directo</div></div>
        </div>
        <div class="act">
          <img src="img/dj-ake.jpg" style="object-position: 50% 30%" alt="DJ AKE">
          <div class="info"><span class="time">Desde 00:00 h</span><div class="name">DJ AKE</div><div class="role">DJ set</div></div>
        </div>
      </div>
    </div>

    <div class="night">
      <div class="day"><b>Sábado</b><span>26 sep</span><i></i></div>
      <div class="acts">
        <div class="act">
          <img src="img/son-aldra.jpg" style="object-position: 50% 20%" alt="Son Aldra">
          <div class="info"><span class="time">22:30 h</span><div class="name">Son Aldra</div><div class="role">En directo</div></div>
        </div>
        <div class="act">
          <img src="img/dj-asped.jpg" style="object-position: 55% 30%" alt="DJ ASPED">
          <div class="info"><span class="time">Desde 00:00 h</span><div class="name">DJ ASPED</div><div class="role">DJ set</div></div>
        </div>
      </div>
    </div>
  </section>

  <footer>Gil² Restaurante<small>¡Te esperamos!</small></footer>
</div>
<script>
  if (new URLSearchParams(location.search).get("f") === "story") document.body.classList.add("story");
</script>
</body>
</html>
