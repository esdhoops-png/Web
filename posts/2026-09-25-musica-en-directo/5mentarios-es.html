<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fin de semana en 5mentarios</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --paper: #f1e6cf;
    --green: #0b7a3a;
    --green-dark: #07592a;
    --ink: #14180f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .canvas {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background:
      radial-gradient(900px 700px at 50% 20%, rgba(255,255,255,.35), transparent 70%),
      var(--paper);
    color: var(--ink);
    font-family: "Inter", sans-serif;
  }
  svg.grain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }

  /* marco doble, en sintonía con el sello del logo */
  .frame { position: absolute; inset: 24px; border: 3px solid var(--green); z-index: 1; pointer-events: none; }
  .frame::after { content: ""; position: absolute; inset: 7px; border: 1.5px solid var(--green); }

  /* cabecera */
  .logo { position: absolute; top: 58px; left: 50%; width: 320px; transform: translateX(-50%); z-index: 21; }
  .title {
    position: absolute; top: 398px; left: 0; right: 0; text-align: center; z-index: 2;
    font-family: "Anton", sans-serif; font-size: 166px; line-height: 1; color: var(--green);
    letter-spacing: -.003em;
  }
  .sub {
    position: absolute; top: 588px; left: 90px; right: 90px; z-index: 2;
    display: flex; align-items: center; gap: 22px;
  }
  .sub::before, .sub::after { content: ""; flex: 1; height: 2px; background: var(--ink); }
  .sub .script { font-family: "Mrs Saint Delafield", cursive; font-size: 86px; line-height: .5; transform: translateY(6px); padding-right: 6px; }
  .sub b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 58px; line-height: 1; letter-spacing: .03em; }

  /* noches */
  .block {
    position: absolute; left: 60px; right: 60px; z-index: 2;
    background:
      radial-gradient(rgba(0,0,0,.14) 1.3px, transparent 1.8px) 0 0 / 9px 9px,
      linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
  }
  .fig { position: absolute; z-index: 3; }
  .strip {
    position: absolute; left: 60px; right: 60px; height: 150px; z-index: 4;
    border: 3px solid var(--green); background: var(--paper);
    display: grid; grid-template-columns: 96px 1fr 1fr; align-items: center;
  }
  .strip .day {
    height: 100%; background: var(--green); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: "Anton", sans-serif; font-size: 34px; letter-spacing: .08em;
    writing-mode: vertical-rl; transform: rotate(180deg);
  }
  .act { text-align: center; }
  .act .name { font-family: "Anton", sans-serif; font-size: 78px; line-height: 1; color: var(--green); letter-spacing: -.003em; }
  .act .time { font-family: "Anton", sans-serif; font-size: 36px; line-height: 1; margin-top: 8px; letter-spacing: .06em; }
  .act .time::before, .act .time::after { content: "—"; font-family: "Inter", sans-serif; font-weight: 400; font-size: 22px; vertical-align: middle; margin: 0 10px; opacity: .5; }
  .act + .act { border-left: 2px solid rgba(11,122,58,.35); }
</style>
</head>
<body>
<div class="canvas">
  <div class="frame"></div>

  <img class="logo" src="logo/5mentarios-original.png" alt="5mentarios · Heineken">
  <div class="title">FIN DE SEMANA</div>
  <div class="sub"><span class="script">en</span><b>5MENTARIOS</b></div>

  <!-- VIERNES -->
  <div class="block" style="top: 800px; height: 330px;"></div>
  <img class="fig" src="print/son-karibe.png" style="left: 76px; bottom: calc(1920px - 1130px); height: 450px;" alt="">
  <img class="fig" src="print/dj-ake.png" style="right: 66px; bottom: calc(1920px - 1130px); height: 425px;" alt="">
  <div class="strip" style="top: 1130px;">
    <div class="day">VIERNES</div>
    <div class="act"><div class="name">SON KARIBE</div><div class="time">22:30</div></div>
    <div class="act"><div class="name">DJ AKE</div><div class="time">00:00</div></div>
  </div>

  <!-- SÁBADO -->
  <div class="block" style="top: 1375px; height: 305px;"></div>
  <img class="fig" src="print/son-aldra.png" style="left: 70px; bottom: calc(1920px - 1680px); height: 360px;" alt="">
  <img class="fig" src="print/dj-asped.png" style="right: 60px; bottom: calc(1920px - 1680px); height: 395px;" alt="">
  <div class="strip" style="top: 1680px;">
    <div class="day">SÁBADO</div>
    <div class="act"><div class="name">SON ALDRA</div><div class="time">22:30</div></div>
    <div class="act"><div class="name">DJ ASPED</div><div class="time">00:00</div></div>
  </div>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 -1.6 1.1"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>
</div>
</body>
</html>
