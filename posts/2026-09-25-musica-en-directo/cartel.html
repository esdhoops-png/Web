<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cartel fin de semana</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --paper: #ece7dd;
    --ink: #173f4f;
    --blue-top: #9cc6ee;
    --blue: #3f86d6;
    --blue-deep: #0f2f63;
    --gold: #f2c14e;
    --w: 1080px; --h: 1920px;
    /* panel y figuras (story por defecto) */
    --panel-top: 270px; --panel-h: 1070px; --panel-x: 150px;
    --frame-pad: 70px;
    --fig-h: 860px; --fig-bottom: 250px;
    --names-bottom: 205px;
    --big: 270px;
  }
  body.feed {
    --h: 1350px;
    --panel-top: 175px; --panel-h: 740px; --panel-x: 190px;
    --frame-pad: 55px;
    --fig-h: 620px; --fig-bottom: 150px;
    --names-bottom: 120px;
    --big: 200px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .canvas {
    width: var(--w); height: var(--h);
    position: relative; overflow: hidden;
    background: var(--paper);
    font-family: "Inter", sans-serif;
  }
  svg.layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 20;
    mix-blend-mode: multiply; opacity: .35; width: 100%; height: 100%;
  }
  .top {
    position: absolute; top: calc(var(--panel-top) - 190px); left: 0; right: 0;
    text-align: center; color: #111; z-index: 3;
  }
  body.feed .top { top: 22px; }
  .top b { display: block; font-weight: 800; font-size: 40px; letter-spacing: .04em; }
  .top small { font-weight: 700; font-size: 20px; letter-spacing: .05em; }
  body.feed .top b { font-size: 32px; }
  body.feed .top small { font-size: 17px; }

  .panel {
    position: absolute; z-index: 2;
    left: var(--panel-x); right: var(--panel-x);
    top: var(--panel-top); height: var(--panel-h);
    background:
      radial-gradient(120% 70% at 50% 0%, var(--blue-top), transparent 70%),
      linear-gradient(180deg, #7fb2e8 0%, var(--blue) 45%, #2a67b8 75%, var(--blue-deep) 100%);
    box-shadow: 0 30px 60px rgba(0,0,0,.35);
    overflow: hidden;
    text-align: center; color: #fff;
  }
  .panel .strip { position: absolute; top: 0; bottom: 0; width: 70px; opacity: .9; }
  .panel .strip.l { left: 12px; } .panel .strip.r { right: 12px; }
  .presents { margin-top: 34px; font-size: 17px; letter-spacing: .32em; text-transform: uppercase; opacity: .8; font-weight: 500; }
  .date {
    font-family: "Bebas Neue", sans-serif; font-size: calc(var(--big) * .36); line-height: 1;
    margin-top: 40px; margin-bottom: 34px; letter-spacing: .02em;
    text-shadow: 0 4px 18px rgba(0,0,0,.2);
  }
  .big {
    font-family: "Bebas Neue", sans-serif; font-size: var(--big); line-height: .82;
    letter-spacing: -.005em;
    text-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .glow {
    position: relative; margin-top: 26px; height: calc(var(--big) * .5);
  }
  .glow span {
    position: absolute; left: 0; right: 0; top: 0;
    font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 1;
  }
  .glow .back { font-size: calc(var(--big) * .5); color: rgba(255,255,255,.4); filter: blur(4px); letter-spacing: .14em; }
  .glow .front {
    top: calc(var(--big) * .14); font-size: calc(var(--big) * .2); color: #fff;
    filter: blur(1.3px);
    text-shadow: 0 0 12px #fff, 0 0 30px rgba(255,255,255,.9);
    letter-spacing: .04em;
  }
  body.feed .presents { margin-top: 22px; font-size: 14px; }
  body.feed .date { margin-top: 22px; }

  .figs { position: absolute; left: 0; right: 0; bottom: var(--fig-bottom); height: var(--fig-h); z-index: 4; }
  .figs img {
    position: absolute; bottom: 0;
    filter: contrast(1.06) saturate(.92) drop-shadow(0 18px 30px rgba(0,0,0,.45));
  }
  .figs img.back { -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 92%); mask-image: linear-gradient(180deg, #000 55%, transparent 92%); }
  /* fundido inferior como en el cartel de referencia */
  .fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--fig-bottom) + var(--fig-h) * .55); z-index: 5;
    background: linear-gradient(180deg, rgba(15,47,99,0) 0%, rgba(15,47,99,.55) 35%, #0b2146 70%, #081833 100%);
  }
  .names {
    position: absolute; left: 30px; right: 30px; bottom: var(--names-bottom); z-index: 6;
    display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; color: #fff;
  }
  .names div { font-family: "Bebas Neue", sans-serif; font-size: 56px; line-height: 1; text-shadow: 0 3px 12px rgba(0,0,0,.6); }
  .names small {
    display: inline-block; margin-top: 10px;
    font-family: "Inter", sans-serif; font-weight: 800; font-size: 17px; letter-spacing: .08em;
    color: #0b2146; background: var(--gold); padding: 5px 10px; border-radius: 4px;
    text-shadow: none;
  }
  body.feed .names div { font-size: 44px; }
  body.feed .names small { font-size: 14px; margin-top: 8px; }
  .info {
    position: absolute; left: 0; right: 0; bottom: 60px; z-index: 6;
    text-align: center; color: #fff;
  }
  .info .badge {
    display: inline-block; background: #fff; color: var(--blue-deep);
    font-family: "Bebas Neue", sans-serif; font-size: 30px; line-height: 1;
    padding: 6px 14px 3px; border-radius: 4px; margin-bottom: 18px;
  }
  .info p { font-weight: 700; font-size: 22px; letter-spacing: .04em; line-height: 1.5; }
  .info p b { font-weight: 800; }
  body.feed .info { bottom: 26px; }
  body.feed .info .badge { display: none; }
  body.feed .info p { font-size: 18px; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="layer" id="pattern" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="top"><b>GIL² RESTAURANTE</b><small>Presenta</small></div>

  <div class="panel">
    <svg class="strip l" id="stripL"></svg>
    <svg class="strip r" id="stripR"></svg>
    <div class="presents">Gil² Restaurante presenta</div>
    <div class="date">25 &amp; 26 SEPT</div>
    <div class="big">FIESTÓN</div>
    <div class="glow"><span class="back">Finde</span><span class="front">En directo + DJ</span></div>
  </div>

  <div class="figs" id="figs">
    <img src="cutouts/son-aldra.png"  data-x="440" data-h=".5"  data-b=".33" class="back" data-z="1" alt="Son Aldra">
    <img src="cutouts/dj-ake.png"     data-x="220" data-h=".74" data-b="0"  data-z="3" alt="DJ AKE">
    <img src="cutouts/dj-asped.png"   data-x="690" data-h=".72" data-b="0"  data-z="3" alt="DJ ASPED">
    <img src="cutouts/son-karibe.png" data-x="-40" data-h=".78" data-b="0"  data-z="4" alt="Son Karibe">
  </div>
  <div class="fade"></div>

  <div class="names">
    <div>Son Karibe<br><small>VIE 25 · 22:30</small></div>
    <div>DJ AKE<br><small>VIE 25 · 00:00</small></div>
    <div>Son Aldra<br><small>SÁB 26 · 22:30</small></div>
    <div>DJ ASPED<br><small>SÁB 26 · 00:00</small></div>
  </div>

  <div class="info">
    <div class="badge">MÚSICA EN DIRECTO + DJ</div>
    <p><b>DÓNDE:</b> Gil² Restaurante</p>
    <p><b>RESERVAS:</b> por mensaje directo · ¡Trae a tu gente!</p>
  </div>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>

<script>
  const feed = new URLSearchParams(location.search).get("f") === "feed";
  if (feed) document.body.classList.add("feed");
  const NS = "http://www.w3.org/2000/svg";
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // glifos geométricos tipo "tribal", dibujados en una celda de 100x100
  const glyphs = [
    () => `<path d="M10 20 L30 50 L10 80 M40 20 L60 50 L40 80 M70 20 L90 50 L70 80"/>`,
    () => `<circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="12" class="f"/>`,
    () => `<path d="M15 15 H85 M15 35 H85 M15 55 H85 M15 75 H85"/>`,
    () => `<path d="M50 12 L88 82 H12 Z"/><path d="M50 40 L66 70 H34 Z" class="f"/>`,
    () => `<path d="M20 20 L80 80 M80 20 L20 80"/>`,
    () => `<path d="M15 85 V20 M35 85 V20 M55 85 V20 M75 85 V20 M10 20 H85"/>`,
    () => `<rect x="18" y="18" width="64" height="64"/><rect x="38" y="38" width="24" height="24" class="f"/>`,
    () => `<path d="M10 50 Q30 15 50 50 T90 50"/><path d="M10 78 Q30 43 50 78 T90 78"/>`,
    () => `<circle cx="25" cy="25" r="8" class="f"/><circle cx="75" cy="25" r="8" class="f"/><circle cx="25" cy="75" r="8" class="f"/><circle cx="75" cy="75" r="8" class="f"/><circle cx="50" cy="50" r="8" class="f"/>`,
    () => `<path d="M50 10 V90 M10 50 H90"/><circle cx="50" cy="50" r="18"/>`,
    () => `<path d="M15 20 H85 V40 H15 V60 H85 V80 H15"/>`,
  ];
  const cell = (x, y, s, color, sw) => {
    const g = glyphs[Math.floor(rnd() * glyphs.length)]();
    const rot = [0, 90, 180, 270][Math.floor(rnd() * 4)];
    return `<g transform="translate(${x} ${y}) scale(${s / 100}) rotate(${rot} 50 50)" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="square">${g.replaceAll('class="f"', `fill="${color}" stroke="none"`)}</g>`;
  };

  const W = 1080, H = feed ? 1350 : 1920;
  const cs = getComputedStyle(document.body);
  const px = v => parseFloat(cs.getPropertyValue(v));
  const pTop = px("--panel-top"), pH = px("--panel-h"), pX = px("--panel-x"), pad = px("--frame-pad");
  const ink = "#173f4f";
  let out = "";
  // bordes laterales con glifos grandes
  const big = 120;
  for (let y = -40; y < H; y += big) {
    out += cell(-50, y, big, ink, 13);
    out += cell(W - 70, y, big, ink, 13);
  }
  // marco denso detrás del panel
  const fx = pX - pad, fy = pTop - pad, fw = W - 2 * fx, fh = pH + 2 * pad;
  out += `<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" fill="#e3ddd1"/>`;
  const s = 58;
  for (let y = fy; y < fy + fh - 4; y += s)
    for (let x = fx; x < fx + fw - 4; x += s)
      out += cell(x + 4, y + 4, s - 8, ink, 11);
  document.getElementById("pattern").innerHTML = out;

  // tiras blancas dentro del panel
  for (const id of ["stripL", "stripR"]) {
    let t = "";
    for (let y = 0; y < pH; y += 70) t += cell(4, y + 4, 62, "rgba(255,255,255,.85)", 9);
    document.getElementById(id).innerHTML = t;
  }

  // figuras: posición y escala relativas a la altura del bloque
  const figH = px("--fig-h"), k = feed ? 0.72 : 1;
  document.querySelectorAll("#figs img").forEach(img => {
    img.style.height = figH * parseFloat(img.dataset.h) + "px";
    img.style.left = parseFloat(img.dataset.x) * (feed ? 1.02 : 1) + "px";
    img.style.zIndex = img.dataset.z;
    img.style.bottom = figH * parseFloat(img.dataset.b) + "px";
  });
</script>
</body>
</html>
