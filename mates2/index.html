<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dinomates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Luckiest+Guy&display=swap">
<style>
/* Layout: el valle de los dinosaurios; selva arriba, arena abajo, tablillas de piedra y huevos que eclosionan */
:root {
  --leaf: #bfe6b0;
  --sand: #fdf1d6;
  --stone: #efe3cf;
  --stone-edge: #6b4f3a;
  --ink: #3a2a1e;
  --ink-soft: #7a6450;
  --card: #fffaf0;
  --lava: #ff6a2b;
  --lava-dark: #c2461a;
  --jungle: #2f8f4e;
  --jungle-dark: #1f6636;
  --red: #d8432f;
  --sun: #ffd23f;
  --display: "Luckiest Guy", "Arial Black", system-ui, sans-serif;
  --body: "Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 70px 40px at 8% 30px, #8fd17c 98%, transparent 100%),
    radial-gradient(ellipse 90px 46px at 30% 10px, #a5dc8f 98%, transparent 100%),
    radial-gradient(ellipse 80px 44px at 62% 24px, #8fd17c 98%, transparent 100%),
    radial-gradient(ellipse 100px 50px at 94% 12px, #a5dc8f 98%, transparent 100%),
    linear-gradient(180deg, var(--leaf) 0, var(--sand) 360px) no-repeat,
    var(--sand);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 540px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; letter-spacing: .02em; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.top { display: flex; align-items: center; gap: 10px; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 3px solid var(--stone-edge); border-radius: 14px; padding: 4px 12px; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; background: var(--card); border: 3px solid var(--stone-edge); display: grid; place-items: center; font-size: 20px; line-height: 1; }

.mascot { display: flex; align-items: center; gap: 10px; }
.mascot svg { width: 86px; height: 72px; flex: none; }
.bubble { flex: 1; min-width: 0; background: var(--card); border: 3px solid var(--stone-edge); border-radius: 20px 20px 20px 4px; padding: 10px 14px; font-size: 18px; }
.bubble b { color: var(--lava-dark); }
@media (prefers-reduced-motion: no-preference) {
  .hop { animation: hop .5s ease; }
  @keyframes hop { 30% { transform: translateY(-12px) rotate(-5deg); } 60% { transform: translateY(0) rotate(3deg); } }
  .stomp { animation: stomp 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes stomp { 50% { transform: translateY(-4px) rotate(2deg); } }
  .wobble { animation: wobble 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wobble { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }
}

/* portada */
.hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 10px; }
.hero > div:first-child { min-width: 0; }
.hero h1 { font-size: clamp(36px, 10.5vw, 58px); color: var(--jungle-dark); text-shadow: 3px 3px 0 var(--sun); }
.hero p { margin: 4px 0 0; color: var(--ink-soft); }
.hero svg { width: 112px; height: 94px; display: block; }
.hero .bubble { grid-column: 1 / -1; }
.namebox { display: flex; gap: 10px; align-items: center; background: var(--card); border: 3px solid var(--stone-edge); border-radius: 16px; padding: 6px 6px 6px 14px; }
.namebox label { font-size: 16px; color: var(--ink-soft); white-space: nowrap; }
.namebox input { flex: 1; min-width: 0; font: inherit; color: var(--ink); border: 0; border-radius: 10px; padding: 6px 10px; background: var(--stone); }
.giant {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; text-align: left;
  background: var(--lava); color: #fff; border: 3px solid var(--stone-edge); border-radius: 26px 20px 28px 18px;
  padding: 14px 16px; box-shadow: 0 6px 0 var(--stone-edge);
}
.giant:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--stone-edge); }
.giant svg { width: 70px; height: 86px; }
.giant .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.giant h2 { font-size: 28px; }
.giant .when { font-weight: 700; }
.section-label { font-family: var(--display); font-size: 26px; color: var(--jungle-dark); }
.section-label small { display: block; font-family: var(--body); font-size: 15px; color: var(--ink-soft); letter-spacing: 0; }
.nests { display: flex; flex-direction: column; gap: 12px; }
.nest {
  display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--stone); border: 3px solid var(--stone-edge); border-radius: 24px 16px 22px 18px; padding: 10px 14px 10px 10px;
  box-shadow: 0 5px 0 var(--stone-edge);
}
.nest:nth-child(even) { border-radius: 16px 24px 18px 22px; }
.nest:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--stone-edge); }
.nest .eggbox { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 50% 70%, #c9a36b 0 55%, #a9844f 56%); display: grid; place-items: center; }
.nest .eggbox svg { width: 48px; height: 60px; }
.nest h3 { font-size: 21px; color: var(--tc); }
.nest p { margin: 0; font-size: 15px; color: var(--ink-soft); }
.nest .st { font-family: var(--display); font-size: 18px; color: var(--lava); white-space: nowrap; }
.park { background: var(--card); border: 3px solid var(--stone-edge); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.dinos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.dinos div { background: var(--stone); border-radius: 16px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; }
.dinos svg { width: 100%; max-width: 72px; height: auto; }
.dinos div.off { color: var(--ink-soft); font-weight: 400; }

/* juego */
.steps { display: flex; gap: 4px; align-items: flex-end; }
.steps i { flex: 1; height: 14px; border-radius: 7px 7px 4px 4px; background: var(--stone); border: 2px solid var(--stone-edge); }
.steps i.ok { background: var(--jungle); }
.steps i.ko { background: var(--red); }
.steps i.now { background: var(--sun); height: 20px; }
.tag { font-family: var(--display); font-size: 17px; color: #fff; background: var(--tc); border-radius: 10px; padding: 3px 12px 1px; align-self: flex-start; letter-spacing: .03em; }
.board { background: var(--card); border: 3px solid var(--stone-edge); border-radius: 26px; padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.q { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.q b { color: var(--lava-dark); }
.target { font-family: var(--display); font-size: 70px; line-height: 1; color: var(--jungle-dark); font-variant-numeric: tabular-nums; }
.words { font-size: 30px; font-weight: 700; margin: 0; }
.listen { background: var(--stone); border-radius: 999px; padding: 5px 14px; font-size: 16px; color: var(--ink-soft); }
.playbig { width: 110px; height: 110px; border-radius: 50%; background: var(--jungle); color: #fff; font-size: 48px; box-shadow: 0 6px 0 var(--jungle-dark); display: grid; place-items: center; }

/* cestas y huevos */
.pile { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: flex-end; min-height: 70px; width: 100%; }
.basket { position: relative; width: 52px; height: 56px; }
.basket svg { width: 100%; height: 100%; }
.egg { width: 24px; height: 30px; }
.eggs { display: grid; grid-template-columns: repeat(5, 24px); gap: 4px; }
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.builder .col { background: var(--stone); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.builder .col b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.builder .col .n { font-family: var(--display); font-size: 40px; line-height: 1; }
.builder .pm { display: flex; gap: 8px; }
.builder .pm button { width: 54px; height: 46px; border-radius: 12px; background: var(--card); border: 3px solid var(--stone-edge); font-family: var(--display); font-size: 26px; }

/* tren */
.train { display: flex; gap: 3px; align-items: flex-end; justify-content: center; flex-wrap: wrap; width: 100%; }
.wagon { position: relative; min-width: 42px; height: 50px; padding: 0 4px; border-radius: 9px; background: var(--tc, #4aa3df); border: 3px solid var(--stone-edge); color: #fff; font-family: var(--display); font-size: 22px; display: grid; place-items: center; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.wagon::before, .wagon::after { content: ""; position: absolute; bottom: -11px; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); border: 3px solid var(--stone); }
.wagon::before { left: 3px; }
.wagon::after { right: 3px; }
.wagon.hole { background: var(--card); color: var(--ink); border-style: dashed; }
.wagon.hole.sel { background: var(--sun); border-style: solid; }
.wagon.hole.ok { background: var(--jungle); color: #fff; border-style: solid; }
.wagon.hole.ko { background: var(--red); color: #fff; border-style: solid; }
.loco { font-size: 36px; line-height: 1; margin-bottom: 6px; }

/* huevos para ordenar */
.eggrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
.bigegg { position: relative; width: 64px; height: 82px; background: none; padding: 0; }
.bigegg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bigegg span { position: relative; font-family: var(--display); font-size: 28px; color: var(--ink); line-height: 82px; font-variant-numeric: tabular-nums; }
.bigegg.done { opacity: .35; }
.bigegg.right svg ellipse { fill: #b7e6a6; }
.bigegg.wrong svg ellipse { fill: #f6b2a8; }
.slots { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.slots span { min-width: 50px; height: 50px; border-radius: 14px; border: 3px dashed var(--stone-edge); display: grid; place-items: center; font-family: var(--display); font-size: 26px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.slots span.f { border-style: solid; background: var(--stone); }
.slots .lt { border: 0; min-width: 0; font-size: 22px; color: var(--ink-soft); }

/* columnas */
.vsum { display: grid; grid-template-columns: 40px 56px 56px; gap: 4px 6px; font-family: var(--display); font-size: 46px; line-height: 1.1; justify-content: center; font-variant-numeric: tabular-nums; }
.vsum > * { display: grid; place-items: center; }
.vsum .hd { font-size: 17px; font-family: var(--body); font-weight: 700; color: #fff; border-radius: 8px; height: 26px; }
.vsum .hd.d { background: var(--jungle); }
.vsum .hd.u { background: var(--lava); }
.vsum .line { grid-column: 1 / -1; height: 4px; background: var(--ink); border-radius: 2px; }
.vsum .slot { width: 56px; height: 62px; border: 3px dashed var(--ink-soft); border-radius: 12px; background: var(--card); font-family: var(--display); font-size: 42px; color: var(--ink); padding: 0; }
.vsum .slot.sel { border-style: solid; border-color: var(--ink); background: var(--sun); }
.vsum .slot.ok { background: var(--jungle); border-color: var(--jungle); color: #fff; }
.vsum .slot.ko { background: var(--red); border-color: var(--red); color: #fff; }
.vsum .res { color: var(--lava-dark); }

.answer { min-width: 140px; height: 76px; border-radius: 18px; border: 3px solid var(--ink); background: var(--sun); font-family: var(--display); font-size: 50px; display: grid; place-items: center; padding: 0 12px; font-variant-numeric: tabular-nums; }
.answer.ok { background: var(--jungle); color: #fff; border-color: var(--jungle); }
.answer.ko { background: var(--red); color: #fff; border-color: var(--red); }
.keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
.keypad button { height: 54px; border-radius: 14px; background: var(--stone); border: 3px solid var(--stone-edge); font-family: var(--display); font-size: 28px; box-shadow: 0 3px 0 var(--stone-edge); }
.keypad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--stone-edge); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.choices.cols1 { grid-template-columns: 1fr; }
.choices.cols3 { grid-template-columns: repeat(3, 1fr); }
.choice { min-height: 70px; border-radius: 18px; background: var(--stone); border: 3px solid var(--stone-edge); font-family: var(--display); font-size: 32px; padding: 8px; box-shadow: 0 4px 0 var(--stone-edge); display: flex; flex-direction: column; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.choice.text { font-family: var(--body); font-weight: 700; font-size: 21px; }
.choice small { font-family: var(--body); font-size: 14px; font-weight: 700; }
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--stone-edge); }
.choice.right { background: var(--jungle); border-color: var(--jungle-dark); color: #fff; }
.choice.wrong { background: var(--red); border-color: #8e2a1d; color: #fff; }
.choice:disabled { cursor: default; }
@media (prefers-reduced-motion: no-preference) { .shake { animation: shake .4s; } @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } } }

.go { width: 100%; min-height: 60px; border-radius: 18px; background: var(--lava); color: #fff; border: 3px solid var(--stone-edge); font-family: var(--display); font-size: 26px; box-shadow: 0 5px 0 var(--stone-edge); letter-spacing: .03em; }
.go.alt { background: var(--card); color: var(--ink); }
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--stone-edge); }
.go:disabled { opacity: .5; }
.explain { background: #ffe9dc; border: 3px solid var(--lava); border-radius: 16px; padding: 10px 14px; text-align: left; width: 100%; font-size: 19px; }
.explain strong { color: var(--lava-dark); }

.result { text-align: center; align-items: center; }
.result .score { font-family: var(--display); font-size: 80px; line-height: 1; color: var(--jungle-dark); font-variant-numeric: tabular-nums; }
.result .stars { font-size: 50px; letter-spacing: 6px; color: var(--sun); -webkit-text-stroke: 2px var(--stone-edge); }
.result .stars .dim { color: var(--stone); }
.result .born svg { width: 160px; height: auto; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }
.parents { font-size: 14px; color: var(--ink-soft); text-align: center; margin: 0; }
</style>
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap" id="app">
  <div class="board">
    <h2>Dinomates</h2>
    <p class="q">Si solo ves este mensaje, el juego no se ha podido abrir aquí.</p>
    <p>Ábrelo con el navegador <b>Chrome</b> o <b>Safari</b>, no con la vista previa de WhatsApp o del correo.</p>
  </div>
</main>

<script>
(function () {
  "use strict";
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tens = n => Math.floor(n / 10);
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  const UNITS = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const TENS = ["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  function words(n) { if (n === 100) return "cien"; if (n < 30) return UNITS[n]; const t = tens(n), u = n % 10; return u ? TENS[t] + " y " + UNITS[u] : TENS[t]; }

  // ---------- guardado ----------
  const KEY = "mates-dino-v1";
  let save = { name: "", stars: 0, best: {}, dinos: [], sound: true };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s) save = Object.assign(save, s);
    else for (const k of ["mates-bruno-v1", "lengua-fresi-v1", "ingles-viaje-v1"]) { const m = JSON.parse(localStorage.getItem(k) || "null"); if (m && m.name) { save.name = m.name; break; } }
  } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  // ---------- sonido y voz ----------
  let actx = null;
  function tone(freq, start, dur, type) {
    if (!save.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, actx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
    } catch (e) {}
  }
  const sndOk = () => { tone(520, 0, .12, "square"); tone(780, .1, .2, "square"); };
  const sndKo = () => { tone(180, 0, .3, "sawtooth"); };
  const sndTap = () => tone(440, 0, .06, "triangle");
  const sndWin = () => [392, 523, 659, 784, 659, 1047].forEach((f, i) => tone(f, i * .14, .2, "square"));
  const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
  function speak(text) {
    try {
      if (!canSpeak) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-ES"; u.rate = 0.9;
      const vs = speechSynthesis.getVoices();
      const v = vs.find(v => /^es(-|_)ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- confeti ----------
  const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let parts = [], raf = 0;
  function confetti(n) {
    if (reduce) return;
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ["#ff6a2b", "#2f8f4e", "#ffd23f", "#4aa3df", "#b06ad9", "#8fd17c"];
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + rnd(-60, 60), y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: rnd(5, 9), c: pick(cols), a: Math.random() * 6, life: 70 + rnd(0, 30) });
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life-- > 0);
    for (const p of parts) { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); cx.restore(); }
    raf = parts.length ? requestAnimationFrame(step) : 0;
    if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
  }

  // ---------- dibujos ----------
  const INK = "#3a2a1e";
  function dino(c, a, faceLeft) {
    const s = 'stroke="' + INK + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
    return '<svg viewBox="0 0 120 100" aria-hidden="true"' + (faceLeft ? ' style="transform:scaleX(-1)"' : "") + ">" +
      '<path d="M30 54l6-12 7 10 7-13 8 12 8-11 6 12" fill="' + a + '" ' + s + "/>" +
      '<path d="M32 66C18 66 8 60 4 50c12 8 22 6 30 2z" fill="' + c + '" ' + s + "/>" +
      '<rect x="38" y="70" width="11" height="22" rx="5" fill="' + c + '" ' + s + '/><rect x="66" y="70" width="11" height="22" rx="5" fill="' + c + '" ' + s + "/>" +
      '<ellipse cx="57" cy="64" rx="28" ry="18" fill="' + c + '" ' + s + "/>" +

  // ---------- preguntas ----------
  const GEN = {
    decenas() {
      const n = rnd(11, 99), t = tens(n), u = n % 10, v = rnd(0, 2);
      const explain = "<strong>" + n + "</strong> = " + plural(t, "cesta", "cestas") + " de 10 y " + plural(u, "huevo suelto", "huevos sueltos") + " (" + plural(t, "decena", "decenas") + " y " + plural(u, "unidad", "unidades") + ").";
      if (v === 0) return { kind: "build", n, html: '<p class="q">Prepara exactamente <b>estos huevos</b></p><div class="target">' + n + "</div>", say: "Prepara " + words(n) + " huevos con cestas de diez y huevos sueltos.", explain };
      if (v === 1) return { kind: "entry", answer: n, html: '<p class="q">¿Cuántos huevos hay?</p><div class="pile">' + basketSVG.repeat(t) + eggsHTML(u) + "</div>", say: "¿Cuántos huevos hay? Cada cesta tiene diez.", explain };
      const askT = Math.random() < .5;
      return { kind: "entry", answer: askT ? t : u, html: '<p class="q">¿Cuántas <b>' + (askT ? "decenas" : "unidades") + '</b> tiene?</p><div class="target">' + n + "</div>", say: "¿Cuántas " + (askT ? "decenas" : "unidades") + " tiene el " + words(n) + "?", explain };
    },
    lectura() {
      const n = rnd(11, 100), v = rnd(0, 2);
      if (v === 0) return { kind: "entry", answer: n, html: '<p class="q">Escribe el número</p><p class="words">' + words(n) + "</p>", say: words(n), explain: "«" + words(n) + "» se escribe <strong>" + n + "</strong>." };
      if (v === 1 && canSpeak) return { kind: "entry", answer: n, listen: true, html: '<p class="q">Escucha y escribe el número</p><button class="playbig" id="play" aria-label="Escuchar el número">🔊</button>', say: words(n), explain: "Era el <strong>" + n + "</strong>: «" + words(n) + "»." };
      const near = shuffle([(n % 10) * 10 + tens(n), n + 10, n - 10, n + 1, n - 1].filter(x => x !== n && x >= 0 && x <= 100)).slice(0, 2);
      return { kind: "choice", cols: 1, html: '<p class="q">¿Cómo se lee?</p><div class="target">' + n + "</div>", say: "¿Cómo se lee este número?", options: shuffle([n].concat(near)).map(x => ({ label: words(x), value: x, text: true })), answer: n, explain: "<strong>" + n + "</strong> se lee «" + words(n) + "»." };
    },
    series() {
      const stp = pick([1, 2, 2, 5, 5, 10, -1, -2, -5, -10]), len = 6;
      const lo = Math.max(0, -stp * (len - 1)), hi = Math.min(100, 100 - stp * (len - 1));
      let start = rnd(lo, hi);
      if (Math.abs(stp) >= 5 && Math.random() < .5) start = Math.max(lo, Math.min(hi, Math.round(start / 5) * 5));
      const seq = Array.from({ length: len }, (_, i) => start + stp * i);
      const holes = shuffle([1, 2, 3, 4, 5]).slice(0, 2).sort((a, b) => a - b);
      return { kind: "train", seq, holes, html: '<p class="q">Completa los vagones que faltan</p>', say: "Completa los vagones del tren. Toca un vagón vacío y escribe el número.",
        explain: "El tren va " + (stp > 0 ? "sumando " + stp : "restando " + (-stp)) + " cada vez: <strong>" + seq.join(", ") + "</strong>." };
    },
    comparar() {
      const v = rnd(0, 2);
      if (v === 0) {
        const base = rnd(1, 8) * 10, set = new Set([base + rnd(0, 9), base + rnd(0, 9)]);
        while (set.size < 4) set.add(rnd(0, 99));
        const nums = shuffle(Array.from(set)), asc = Math.random() < .6;
        const sorted = nums.slice().sort((a, b) => asc ? a - b : b - a);
        return { kind: "order", nums, sorted, asc, html: '<p class="q">Toca los huevos <b>' + (asc ? "de menor a mayor" : "de mayor a menor") + "</b></p>", say: "Toca los huevos de " + (asc ? "menor a mayor" : "mayor a menor") + ".",
          explain: "El orden es: <strong>" + sorted.join(asc ? " &lt; " : " &gt; ") + "</strong>. Mira primero las decenas y, si son iguales, las unidades." };
      }
      if (v === 1) {
        const a = rnd(0, 100), r = Math.random(); let b;
        if (r < .2) b = a; else if (r < .6) b = Math.min(100, tens(a) * 10 + rnd(0, 9)); else b = (a % 10) * 10 + tens(a);
        if (r >= .2 && b === a) b = a === 100 ? 99 : a + 1;
        const ans = a < b ? "<" : a > b ? ">" : "=";
        return { kind: "choice", cols: 3, html: '<p class="q">¿Qué signo va en medio?</p><div class="target">' + a + ' <span style="color:var(--lava)">?</span> ' + b + "</div>", say: "¿Qué signo va entre el " + words(a) + " y el " + words(b) + "?",
          options: [{ label: "&lt;<small>menor</small>", value: "<" }, { label: "=<small>igual</small>", value: "=" }, { label: "&gt;<small>mayor</small>", value: ">" }], answer: ans,
          explain: "<strong>" + a + " " + ans.replace("<", "&lt;").replace(">", "&gt;") + " " + b + "</strong>. " + (a === b ? "Son iguales." : "La boca abierta mira al número mayor.") };
      }
      const big = Math.random() < .5, set = new Set();
      const base = rnd(2, 8) * 10; set.add(base + rnd(0, 9)); set.add(base + rnd(0, 9));
      while (set.size < 4) set.add(rnd(0, 99));
      const nums = shuffle(Array.from(set)), ans = big ? Math.max(...nums) : Math.min(...nums);
      return { kind: "choice", html: '<p class="q">Toca el número <b>' + (big ? "mayor" : "menor") + "</b></p>", say: "Toca el número " + (big ? "mayor." : "menor."),
        options: nums.map(x => ({ label: x, value: x })), answer: ans, explain: "El " + (big ? "mayor" : "menor") + " es <strong>" + ans + "</strong>." };
    },
    sumas() {
      const add = Math.random() < .5;
      let ta, tb, ua, ub;
      if (add) { ta = rnd(1, 8); tb = Math.random() < .35 ? 0 : rnd(1, 9 - ta); ua = rnd(0, 8); ub = rnd(1, 9 - ua); }
      else { ta = rnd(1, 9); tb = Math.random() < .35 ? 0 : rnd(1, ta); ua = rnd(1, 9); ub = rnd(0, ua); }
      const a = ta * 10 + ua, b = tb * 10 + ub, op = add ? "+" : "−", res = add ? a + b : a - b;
      const steps = "Primero las unidades: " + ua + " " + op + " " + ub + " = " + (res % 10) + ". Después las decenas: " + ta + " " + op + " " + tb + " = " + tens(res) + ".";
      if (Math.random() < .55) return { kind: "sum", ta, tb, ua, ub, op, answer: res, html: '<p class="q">' + (add ? "Resuelve la suma" : "Resuelve la resta") + " del volcán</p>", say: words(a) + (add ? " más " : " menos ") + words(b) + ". Empieza por las unidades.", explain: steps + " Resultado: <strong>" + res + "</strong>." };
      // ¿está bien hecha?
      const kinds = ["ok", "ok", "unit", "tens"]; if (tb === 0 && add && ta + ub <= 9) kinds.push("align", "align");
      const k = pick(kinds);
      let shown = res, lay = { ta, tb, ua, ub }, why = "";
      if (k === "unit") { const d = res % 10 === 9 ? -1 : 1; shown = res + d; why = "Las unidades están mal: " + ua + " " + op + " " + ub + " = " + (res % 10) + "."; }
      if (k === "tens") { shown = tens(res) < 9 ? res + 10 : res - 10; why = "Las decenas están mal: " + ta + " " + op + " " + tb + " = " + tens(res) + "."; }
      if (k === "align") { lay = { ta, tb: ub, ua, ub: "" }; shown = (ta + ub) * 10 + ua; why = "El " + ub + " está mal colocado: son unidades y va debajo de la U."; }
      const ok = k === "ok";
      return { kind: "choice", cols: 2, html: '<p class="q">Un dino ha hecho esta cuenta. <b>¿Está bien?</b></p>' + vsum(lay, op, shown), say: "Un dinosaurio ha hecho esta cuenta. ¿Está bien hecha?",
        options: [{ label: "✔<small>Está bien</small>", value: true }, { label: "✘<small>Está mal</small>", value: false }], answer: ok,
        explain: (ok ? "¡Está bien hecha! " : why + " ") + "La cuenta correcta: <strong>" + a + " " + op + " " + b + " = " + res + "</strong>." };
    }
  };
  function vsum(l, op, result) {

    return '<div class="vsum"><div></div><div class="hd d">D</div><div class="hd u">U</div><div></div><div>' + l.ta + "</div><div>" + l.ua + "</div><div>" + op + "</div><div>" + (l.tb || "") + "</div><div>" + l.ub + '</div><div class="line"></div>' + r + "</div>";

  // ---------- pantalla ----------

  function renderChoices(q, area) {

        if (!ok) b.classList.add("wrong", "shake");

  function renderBuild(q, area) {

      '<div class="col"><b>Huevos sueltos</b><span class="n" id="ne">0</span><div class="pm"><button data-a="e-">−</button><button data-a="e+">+</button></div></div>';
    const go = document.createElement("button"); go.className = "go"; go.textContent = "¡Listo!";
    area.appendChild(pile); area.appendChild(ctr); area.appendChild(go);
    const paint = () => { pile.innerHTML = basketSVG.repeat(b) + eggsHTML(e) || '<span style="color:var(--ink-soft)">Aquí aparecen tus huevos</span>'; ctr.querySelector("#nb").textContent = b; ctr.querySelector("#ne").textContent = e; };
    paint();
    ctr.querySelectorAll("[data-a]").forEach(x => x.addEventListener("click", () => {
      sndTap();
      const a = x.dataset.a;
      if (a === "b+" && b < 10) b++; if (a === "b-" && b > 0) b--; if (a === "e-" && e > 0) e--;
      if (a === "e+") { if (e < 9) e++; else say("¡Con 10 huevos sueltos llenas una <b>cesta</b>! Usa el botón de cestas."); }
      paint();
    }));
    go.addEventListener("click", () => {
      const ok = b * 10 + e === q.n;
      ctr.querySelectorAll("button").forEach(x => x.disabled = true); go.remove();
      if (!ok) pile.classList.add("shake");
      finish(ok, area);
    });
  }

  function renderTrain(q, area) {
    const tr = document.createElement("div"); tr.className = "train";
    const vals = {}; let sel = q.holes[0];
    tr.innerHTML = '<span class="loco" aria-hidden="true">🚂</span>' + q.seq.map((x, i) => q.holes.includes(i) ? '<button class="wagon hole" data-i="' + i + '" style="--tc:' + TOPICS.series.color + '">?</button>' : '<span class="wagon" style="--tc:' + TOPICS.series.color + '">' + x + "</span>").join("");
    area.appendChild(tr);
    const paint = () => tr.querySelectorAll(".hole").forEach(w => { const i = +w.dataset.i; w.textContent = vals[i] || "?"; w.classList.toggle("sel", i === sel); });
    tr.querySelectorAll(".hole").forEach(w => w.addEventListener("click", () => { sel = +w.dataset.i; paint(); }));
    paint();
    const remove = keypad(area, k => {
      if (sel === null) return;
      let v = vals[sel] || "";
      if (k === "del") v = v.slice(0, -1); else if (v.length < 3 && Number(v + k) <= 100) v = (v === "0" ? "" : v) + k;
      vals[sel] = v; paint();
    }, () => {
      if (q.holes.some(i => !vals[i])) { sel = q.holes.find(i => !vals[i]); paint(); say("Te falta un vagón por rellenar."); return; }
      let ok = true;
      q.holes.forEach(i => { const w = tr.querySelector('[data-i="' + i + '"]'), good = Number(vals[i]) === q.seq[i]; ok = ok && good; w.classList.remove("sel"); w.classList.add(good ? "ok" : "ko"); w.disabled = true; if (!good) w.textContent = q.seq[i]; });
      sel = null; remove(); finish(ok, area);
    });
  }

  function renderOrder(q, area) {
    const slots = document.createElement("div"); slots.className = "slots";
    const row = document.createElement("div"); row.className = "eggrow";
    const picked = [];
    const paintSlots = () => { slots.innerHTML = q.sorted.map((_, i) => (i ? '<span class="lt">' + (q.asc ? "&lt;" : "&gt;") + "</span>" : "") + '<span class="' + (picked[i] !== undefined ? "f" : "") + '">' + (picked[i] !== undefined ? picked[i] : "") + "</span>").join(""); };
    q.nums.forEach(n => {
      const b = document.createElement("button"); b.className = "bigegg";
      b.innerHTML = eggSVG("#fff4c9", "#f2c94c") + "<span>" + n + "</span>";
      b.addEventListener("click", () => {
        if (b.disabled) return;
        sndTap();
        const good = q.sorted[picked.length] === n;
        picked.push(n); b.disabled = true; b.classList.add("done");
        paintSlots();
        if (!good) { row.querySelectorAll("button").forEach(x => x.disabled = true); slots.classList.add("shake"); return finish(false, area); }
        if (picked.length === q.nums.length) finish(true, area);
      });
      row.appendChild(b);
    });
    paintSlots();
    area.appendChild(slots); area.appendChild(row);
  }

  function renderSum(q, area) {
    area.innerHTML = vsum(q, q.op).replace('<div class="line"></div>', '<div class="line"></div><div></div><button class="slot" data-s="d" aria-label="Decenas"></button><button class="slot sel" data-s="u" aria-label="Unidades"></button>');
    const val = { d: "", u: "" }; let sel = "u";
    const slots = { d: area.querySelector('[data-s="d"]'), u: area.querySelector('[data-s="u"]') };
    const paint = () => { for (const k in slots) { slots[k].textContent = val[k]; slots[k].classList.toggle("sel", k === sel); } };
    for (const k in slots) slots[k].addEventListener("click", () => { sel = k; paint(); });
    const remove = keypad(area, k => { if (!sel) return; if (k === "del") { if (val[sel] === "" && sel === "d") sel = "u"; val[sel] = ""; } else { val[sel] = k; if (sel === "u") sel = "d"; } paint(); }, () => {
      if (val.u === "") { sel = "u"; paint(); say("Empieza por las <b>unidades</b>: la casilla de la derecha."); return; }
      const ru = q.answer % 10, rt = tens(q.answer), ok = Number(val.d || 0) * 10 + Number(val.u) === q.answer;
      slots.u.classList.add(Number(val.u) === ru ? "ok" : "ko"); slots.d.classList.add(Number(val.d || 0) === rt ? "ok" : "ko");
      if (!ok) { slots.u.textContent = ru; slots.d.textContent = rt || ""; }
      sel = null; Object.values(slots).forEach(s => s.disabled = true); remove(); finish(ok, area);
    });
  }

  function finish(ok, area) {
    game.marks[game.i] = ok;
    const st = document.querySelectorAll(".steps i")[game.i]; if (st) st.className = ok ? "ok" : "ko";
    if (ok) {
      game.score++; save.stars++; persist(); sndOk(); confetti(40);
      say(pick(["¡GRRRR-ACIAS" + nm() + "! ¡Muy bien!", "¡Dino-genial!", "¡Eso es!", "¡Fenomenal" + nm() + "!", "¡Rugido de campeona!"]));
      setTimeout(next, 1400);
    } else {
      sndKo();
      say(pick(["¡Casi! Mira cómo es.", "No pasa nada, así se aprende.", "¡Uy! Fíjate bien."]));
      const ex = document.createElement("div"); ex.className = "explain"; ex.innerHTML = game.qs[game.i].explain;
      const b = document.createElement("button"); b.className = "go"; b.textContent = "Seguir"; b.addEventListener("click", next);
      area.appendChild(ex); area.appendChild(b);
      b.focus({ preventScroll: true });
    }
  }
  function next() { if (!game) return; game.i++; if (game.i < game.qs.length) question(); else results(); }

  function results() {
    const total = game.qs.length, s = game.score, st = starsFor(s, total), need = game.key === "examen" ? 12 : 7;
    let born = null;
    if (s >= need) { const left = DINOS.filter(d => !save.dinos.includes(d.n)); born = left.length ? pick(left) : pick(DINOS); if (left.length) save.dinos.push(born.n); }
    save.best[game.key] = Math.max(save.best[game.key] || 0, st); persist();
    if (st >= 2) { sndWin(); confetti(140); }
    const msg = st === 3 ? "¡Increíble" + nm() + "! Estás lista para la prueba." : st === 2 ? "¡Muy bien" + nm() + "! Un poquito más y lo bordas." : st === 1 ? "¡Buen trabajo! Repetimos y verás cómo sale mejor." : "¡Ánimo! Practicando se aprende. ¿Otra vez?";
    const title = game.key === "examen" ? "El huevo gigante" : TOPICS[game.key].name;
    app.innerHTML =
      '<div class="top"><button class="iconbtn" id="back" aria-label="Volver al inicio">←</button><span class="spacer"></span><span class="pill">⭐ ' + save.stars + "</span></div>" +
      '<div class="board result"><h2>' + title + '</h2><div class="score">' + s + " / " + total + '</div><div class="stars">' + "★".repeat(st) + '<span class="dim">' + "★".repeat(3 - st) + "</span></div>" +
      (born ? '<div class="born">' + dino(born.c, born.a) + '</div><p class="q">¡Ha nacido <b>' + born.n + "</b>! Ya vive en tu parque.</p>" : '<p class="q">Con ' + need + " aciertos nace un dino nuevo.</p>") +
      '<div class="btnrow"><button class="go alt" id="home">Inicio</button><button class="go" id="again">Otra vez</button></div></div>' + mascotHTML(msg);
    document.getElementById("back").addEventListener("click", home);
    document.getElementById("home").addEventListener("click", home);
    const k = game.key;
    document.getElementById("again").addEventListener("click", () => start(k));
    window.scrollTo(0, 0);
  }

  home();
})();
</script>
</body>
</html>
