<title>Centro de control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EE;--surface:#FFFFFF;--ink:#141414;--muted:#6B6560;--line:#E4DFD9;--soft:#F8F6F3;
  --side:#141414;--side-ink:#F1EEEA;--side-muted:#8F8983;--side-hover:#242424;
  --danger:#C2321F;--warn:#C98A1B;--ok:#1F8A5B;
  --s-idea:#A39C95;--s-guion:#6E7BD9;--s-grabado:#D69A2D;--s-diseno:#B556C7;--s-listo:#1F8A5B;--s-publicado:#141414;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101010;--surface:#1B1B1B;--ink:#F1EEEA;--muted:#A39C95;--line:#2D2D2D;--soft:#222222;
  --side:#0A0A0A;--side-hover:#1C1C1C;--s-publicado:#F1EEEA;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101010;--surface:#1B1B1B;--ink:#F1EEEA;--muted:#A39C95;--line:#2D2D2D;--soft:#222222;
  --side:#0A0A0A;--side-hover:#1C1C1C;--s-publicado:#F1EEEA;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Hanken Grotesk",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;padding:0 8px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--side-muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.acc button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:8px;text-align:left;font-weight:600}
.nav button:hover,.acc button:hover{background:var(--side-hover)}
.nav button[aria-current="true"]{background:var(--side-ink);color:var(--side)}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.side h4{margin:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted)}
.acc{display:flex;flex-direction:column;gap:2px}
.acc button{font-weight:500}
.acc button[aria-current="true"]{background:var(--side-hover);box-shadow:inset 2px 0 0 var(--c)}
.acc small{margin-left:auto;color:var(--side-muted);font-size:11px}
/* main */
main{min-width:0;padding:22px 24px 80px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;color:var(--muted)}
.notice[hidden]{display:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.inp,input.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.av.sm{width:20px;height:20px;font-size:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--sc)}
.tag{font-size:11px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.flag{color:var(--danger);font-weight:800;font-size:11px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3 small{font-weight:500;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:10px}
/* resumen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.kpi.alert b{color:var(--danger)}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border-top:4px solid var(--c)}
.acard:hover{border-color:var(--muted);border-top-color:var(--c)}
.acard .hd{display:flex;align-items:center;gap:10px}
.acard .hd b{display:block;font-size:14px}
.acard .hd small{color:var(--muted);font-size:12px}
.bars{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}
.bars span{background:var(--sc)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px}
.meta div{display:flex;flex-direction:column}
.meta span{color:var(--muted)}
.meta b{font-weight:700}
.meta .warn{color:var(--danger)}
.next{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.next b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);text-align:left;width:100%}
.r .tx{min-width:0;flex:1}
.r .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.r .tx small{color:var(--muted);font-size:11px}
.r .when{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.r .when.late{color:var(--danger);font-weight:700}
/* calendario */
.calbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.calbar .ttl{font-weight:800;font-size:16px;margin:0 6px;min-width:150px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:260px;display:flex;flex-direction:column}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.over{background:var(--soft);border-style:dashed}
.day h4{margin:0;padding:10px 10px 6px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;text-transform:uppercase;letter-spacing:.04em}
.day h4 span{font-size:18px;letter-spacing:-.02em}
.ev{margin:0 6px 6px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--soft);border:1px dashed var(--muted);color:var(--ink);cursor:pointer;text-align:left}
.day .list{padding:0 6px 6px;display:flex;flex-direction:column;gap:6px;flex:1}
.add{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;color:var(--muted);font-size:12px}
.add:hover{border-color:var(--muted);color:var(--ink)}
.card{border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:8px;padding:7px 8px;background:var(--soft);text-align:left;width:100%;display:block}
.card[draggable="true"]{cursor:grab}
.card.late{box-shadow:inset 0 0 0 1px var(--danger)}
.thumb{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;margin-bottom:7px;background:var(--line)}
.mi img{width:18px;height:22px;object-fit:cover;border-radius:2px;flex:none}
.feedhead{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.feedhead .avr{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.feedhead .avr img{width:100%;height:100%;object-fit:contain}
.feedhead b{font-size:18px} .feedhead small{display:block;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;max-width:720px}
.ft{position:relative;aspect-ratio:4/5;background:var(--soft);overflow:hidden;border:0;padding:0;cursor:pointer;text-align:left}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.ft .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px;background:linear-gradient(160deg,var(--soft),var(--line));color:var(--ink)}
.ft .ph b{font-size:13px;line-height:1.25} .ft .ph small{font-size:11px;color:var(--muted)}
.ft .ic{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 5px}
.ft .dt{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;border-radius:4px;padding:2px 6px}
.ft.past{opacity:.6}
.imgbox{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.imgbox img{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.card .t{font-weight:600;font-size:13px;line-height:1.3;word-break:break-word}
.card .m{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;font-size:11px;color:var(--muted);align-items:center}
.card p{margin:5px 0 0;font-size:12px;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prog{font-size:11px;font-weight:700;color:var(--muted)}
.prog.full{color:var(--ok)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wd{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);padding:2px 6px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:110px;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left}
.mc.out{opacity:.45}
.mc.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mc .n{font-size:12px;font-weight:800;display:flex;justify-content:space-between}
.mi{display:flex;align-items:center;gap:4px;font-size:11px;border:0;background:none;padding:1px 2px;border-radius:4px;text-align:left;width:100%;min-width:0}
.mi:hover{background:var(--soft)}
.mi span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ef{font-weight:700}
.more{font-size:11px;color:var(--muted);border:0;background:none;text-align:left;padding:0 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
/* tablero */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:300px}
.col.over{background:var(--soft);border-style:dashed}
.col h4{margin:0;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.col h4 i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.col h4 small{margin-left:auto;color:var(--muted);font-weight:600}
.col .list{padding:8px;display:flex;flex-direction:column;gap:6px}
/* ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ideas .card{background:var(--surface);cursor:pointer}
.ideas .acts{display:flex;gap:6px;margin-top:8px}
.ideas .acts .btn{padding:4px 9px;font-size:12px}
/* cuentas */
.cgrid{display:grid;grid-template-columns:1fr;gap:12px}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;border-top:4px solid var(--c)}
.chead .av{width:46px;height:46px;font-size:16px}
.chead h2{margin:0;font-size:20px}
.chead small{color:var(--muted)}
.chead .links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chead .links a{font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-decoration:none}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f textarea,.f input,.f select{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;resize:vertical;width:100%;min-width:0}
.f textarea{min-height:76px}
.f [readonly]{background:transparent}
.f .hint{font-size:11px;color:var(--muted)}
.saved{font-size:12px;color:var(--muted);min-height:16px;margin-top:8px}
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:4px 8px;border-bottom:1px solid var(--line)}
td input{width:100%;min-width:70px;border:1px solid transparent;background:none;border-radius:6px;padding:5px 6px}
td input:hover,td input:focus{border-color:var(--line);background:var(--soft)}
.delta{font-size:11px;font-weight:700}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}
.chart{width:100%;height:auto;max-height:220px;display:block}
.tpl{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.tpl b{font-size:13px}
.tpl pre{margin:0;white-space:pre-wrap;font:inherit;font-size:13px;color:var(--muted)}
.tpl .acts{display:flex;gap:6px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.mix{display:flex;flex-direction:column;gap:6px}
.mixrow{display:grid;grid-template-columns:80px 1fr 50px;gap:8px;align-items:center;font-size:12px}
.mixrow .bg{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mixrow .bg span{display:block;height:100%;background:var(--c)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;background:var(--soft)}
.checks input{accent-color:var(--ok)}
.f .checks label{text-transform:none;letter-spacing:0;color:var(--ink);font-size:12px}
.capbar select.inp{width:auto}
.capbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.capbar .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lgc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.lgv{aspect-ratio:4/3;display:grid;place-items:center;padding:22px;border-bottom:1px solid var(--line)}
.lgv img{max-width:100%;max-height:100%;display:block}
.lgm{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lgm b{font-size:13px} .lgm span{display:flex;gap:6px;flex-wrap:wrap} .lgm .btn{padding:5px 10px;font-size:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.colc{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 0 10px;overflow:hidden;cursor:pointer}
.colc span{height:70px;display:block;border-bottom:1px solid var(--line)} .colc b,.colc code,.colc small{padding:0 10px} .colc b{font-size:13px;margin-top:6px} .colc code{font-size:12px;color:var(--muted)} .colc small{font-size:11px;color:var(--muted)}
.mobnav{display:none}
/* comunidad */
.cbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.cbar span{display:block;height:100%;background:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.pc.done{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.pc .hd{display:flex;align-items:center;gap:10px}
.pc .hd a{font-weight:800;color:var(--ink);text-decoration:none;font-size:14px;word-break:break-all}
.pc .hd a:hover{text-decoration:underline}
.pc .hd small{display:block;color:var(--muted);font-size:12px}
.pc p{margin:0;font-size:13px;color:var(--muted)}
.pc .tags{display:flex;flex-wrap:wrap;gap:4px}
.pc .warn{color:var(--warn);border-color:var(--warn)}
.pc .row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc .row2 .btn{padding:5px 10px;font-size:12px}
.pc .row2 select{padding:4px 8px;font-size:12px}
.pc .last{font-size:11px;color:var(--muted);margin-left:auto}
.pc .dm{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pc .dm summary{cursor:pointer;font-weight:700;font-size:12px}
.pc .dm p{margin:8px 0;color:var(--ink);white-space:pre-wrap;font-size:13px;line-height:1.45}
.pc .dm .btn{padding:5px 10px;font-size:12px}
.pc .note{font-size:12px;background:var(--soft);border-radius:8px;padding:6px 8px;color:var(--ink)}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:14px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
@media (max-width:1100px){
  .two{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ---------- helpers ---------- */
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const today=()=>iso(new Date());
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function clientOf(id){return clients.find(c=>c.id===id)}
function cColor(id){return clientOf(id)?.color||"#999"}
function cName(id){return clientOf(id)?.name||"Sin cuenta"}
function initials(n){return (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function av(c,sm){return `<span class="av${sm?" sm":""}" style="--c:${esc(c?.color||"#999")}">${esc(initials(c?.name))}</span>`}
function pillarsOf(c){return (c?.pilares||"").split("\n").map(s=>s.replace(/^\s*[\d]+[.)]\s*/,"").replace(/^[-·•]\s*/,"").split(":")[0].trim()).filter(Boolean)}
function inSel(it){return S.sel==="all"||it.clientId===S.sel}
function selClients(){return S.sel==="all"?clients:clients.filter(c=>c.id===S.sel)}
function isLate(it){return it.date&&it.date<today()&&it.status!=="publicado"}
function checkCount(it){const c=it.checks||{};return CHECKS.filter(k=>c[k[0]]).length}
function pill(st){const s=SMAP[st]||SMAP.idea;return `<span class="pill" style="--sc:var(${s[2]})"><i></i>${s[1]}</span>`}
function weekKeys(ws){return [...Array(7)].map((_,i)=>iso(addDays(ws,i)))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)}
function note(m){const n=$("#notice");n.hidden=!m;n.textContent=m||""}
function whenLabel(it){if(!it.date)return "Sin fecha";const d=parse(it.date);return fmtW.format(d)+(it.time?" · "+it.time:"")}

function cardHTML(it,opts={}){
  const n=checkCount(it);
  return `<div class="card${isLate(it)?" late":""}" role="button" tabindex="0" data-id="${esc(it.id)}" ${canWrite&&opts.drag!==false?'draggable="true"':""} style="--c:${esc(cColor(it.clientId))}">
    ${it.img&&opts.thumb!==false?`<img class="thumb" src="${esc(it.img)}" alt="" loading="lazy">`:""}
    <div class="t">${it.prio==="alta"?'<span class="flag">● </span>':""}${esc(it.title||"(sin título)")}</div>
    <div class="m">${S.sel==="all"||opts.showClient?esc(cName(it.clientId))+" · ":""}${esc(it.format||"Post")}${it.time?" · "+esc(it.time):""}${opts.date&&it.date?" · "+esc(fmtD.format(parse(it.date))):""}</div>
    <div class="m">${opts.noStatus?"":pill(it.status)}<span class="prog${n===5?" full":""}">✓ ${n}/5</span>${it.pilar?`<span class="tag">${esc(it.pilar)}</span>`:""}${it.campaign?`<span class="tag">#${esc(it.campaign)}</span>`:""}</div>
    ${opts.copy&&(it.copy||it.notes)?`<p>${esc(it.copy||it.notes)}</p>`:""}

function bindCards(root){
  root.querySelectorAll(".card[data-id]").forEach(b=>{
    const open=()=>openItem(items.find(x=>x.id===b.dataset.id));
    b.addEventListener("click",e=>{if(e.target.closest("[data-act]"))return;open()});
    b.addEventListener("keydown",e=>{if(e.key==="Enter")open()});
    b.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",b.dataset.id);e.dataTransfer.effectAllowed="move"});
  });
}
function dropZone(el,onDrop){
  el.addEventListener("dragover",e=>{if(!canWrite)return;e.preventDefault();el.classList.add("over")});
  el.addEventListener("dragleave",()=>el.classList.remove("over"));
  el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("over");const id=e.dataTransfer.getData("text/plain");if(id)onDrop(id)});
}
async function patchItem(id,data){
  const it=items.find(x=>x.id===id);if(!it||!db)return;
  if(Object.keys(data).every(k=>it[k]===data[k]))return;
  try{await db.doc("items/"+id).update(data);toast("Actualizado")}catch(e){toast("No se pudo guardar")}
}

/* ---------- centro de control ---------- */
const evEnd=e=>e.end&&e.end>=e.date?e.end:e.date;
const evSort=(a,b)=>((a.date||"9999")+(a.time||"")).localeCompare((b.date||"9999")+(b.time||""));
function daysTo(d){return Math.round((parse(d)-parse(today()))/864e5)}
function cdLabel(e){if(!e.date)return "Por fijar";const n=daysTo(e.date);if(n===0)return "Hoy";if(n===1)return "Mañana";if(n>1)return "En "+n+" días";if(evEnd(e)>=today())return "En curso";return "Pasado"}
function ckParse(t){return (t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^\[(x|X| )\]\s*(.*)$/);return m?{t:m[2],done:m[1].toLowerCase()==="x"}:{t:l.replace(/^[-·•]\s*/,""),done:false}})}
function ckText(arr){return (arr||[]).map(c=>(c.done?"[x] ":"")+c.t).join("\n")}
function estPill(st){const e=ESTAT.find(x=>x[0]===st)||ESTAT[0];return `<span class="est ${e[0]}">${e[1]}</span>`}
function evCard(e){
  const ck=e.checklist||[],dn=ck.filter(c=>c.done).length,past=e.date&&evEnd(e)<today();
  const n=e.date?daysTo(e.date):null;
  return `<div class="evc${past?" past":""}" style="--c:${esc(cColor(e.clientId))}">
    <div class="top2"><div style="min-width:0"><small style="color:var(--muted);font-size:11.5px;font-weight:700">${esc(cName(e.clientId))} · ${esc(e.type||"Evento")}</small><h4>${esc(e.title||"(sin nombre)")}</h4></div><span class="cd${n!==null&&n>=0&&n<=7?" soon":""}">${esc(cdLabel(e))}</span></div>
    <div class="meta2"><span>📅 ${e.date?esc(fmtW.format(parse(e.date)))+(e.end&&e.end>e.date?" – "+esc(fmtD.format(parse(e.end))):"")+(e.time?" · "+esc(e.time):""):"Fecha por fijar"}</span>${e.place?`<span>📍 ${esc(e.place)}</span>`:""}${e.budget?`<span>💶 ${esc(e.budget)}</span>`:""}${e.cap?`<span>👥 ${esc(e.cap)}</span>`:""}</div>
    <div>${estPill(e.status)}${e.contact?` <span class="tag">${esc(e.contact)}</span>`:""}</div>
    ${ck.length?`<div class="bar2" title="${dn}/${ck.length}"><b style="width:${dn/ck.length*100}%"></b></div><ul class="ckl">${ck.map((c,i)=>`<li><label class="${c.done?"done":""}"><input type="checkbox" data-ck="${esc(e.id)}" data-i="${i}"${c.done?" checked":""}${canWrite?"":" disabled"}><span>${esc(c.t)}</span></label></li>`).join("")}</ul>`:""}
    ${e.notes?`<p style="margin:0;font-size:12.5px;color:var(--muted);white-space:pre-line">${esc(e.notes)}</p>`:""}
    <div class="acts"><button class="btn" data-eopen="${esc(e.id)}">Abrir</button>${e.link&&/^https?:\/\//.test(e.link)?`<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">Enlace ↗</a>`:""}</div>
  </div>`;
}
function bindEv(root){

function renderHoy(){
  const t=today(),now=new Date(),ws=monday(now),wk=weekKeys(ws);

      ${nextEv.slice(0,6).map(e=>{const ck=e.checklist||[],dn=ck.filter(c=>c.done).length;return `<button class="r" data-eopen="${esc(e.id)}">${av(clientOf(e.clientId),1)}<span class="tx"><b>${esc(e.title)}</b><small>${esc(e.type||"")}${ck.length?` · ✓ ${dn}/${ck.length}`:""} · ${ESTAT.find(x=>x[0]===e.status)?.[1]||"Idea"}</small></span><span class="when">${esc(cdLabel(e))}</span></button>`}).join("")||'<div class="empty">Sin eventos. Añade torneos, sesiones, conciertos…</div>'}
    </div></div>
  </div>`;
  h+=`<div class="panel" style="margin-bottom:10px"><h3>Esta semana <small>${esc(fmtD.format(ws))} – ${esc(fmtD.format(addDays(ws,6)))}</small></h3><div class="wk7">${wk.map((k,i)=>{

function copyWeek(ws){
  const wk=weekKeys(ws);
  let txt=`PLAN DE CONTENIDO · ${fmtD.format(ws)} – ${fmtD.format(addDays(ws,6))}\n`;
  selClients().forEach(c=>{
    const its=items.filter(i=>i.clientId===c.id&&wk.includes(i.date)).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
    if(!its.length)return;
    txt+=`\n${c.name.toUpperCase()}\n`+its.map(i=>`· ${fmtW.format(parse(i.date))}${i.time?" "+i.time:""} · ${i.format} · ${i.title} (${SMAP[i.status]?.[1]||""})`).join("\n")+"\n";
  });
  navigator.clipboard.writeText(txt).then(()=>toast("Plan copiado"),()=>toast("No se pudo copiar"));
}

function renderMonth(){
  const m=S.month,start=monday(m),t=today();
  let html=`<div class="calbar"><button class="btn" id="prev" aria-label="Anterior">←</button><span class="ttl">${esc(cap(fmtM.format(m).replace(" de "," ")))}</span><button class="btn" id="next" aria-label="Siguiente">→</button><button class="btn" id="tdy">Hoy</button></div>
    <div class="month">${DAYS.map(d=>`<div class="wd">${d}</div>`).join("")}`;
  for(let i=0;i<42;i++){
    const d=addDays(start,i),k=iso(d);
    if(i===35&&d.getMonth()!==m.getMonth())break;
    const list=items.filter(it=>it.date===k&&inSel(it)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    const evs=dates.filter(x=>x.date===k&&(S.sel==="all"||!x.clientId||x.clientId===S.sel));
    html+=`<div class="mc${d.getMonth()!==m.getMonth()?" out":""}${k===t?" today":""}" data-date="${k}"><div class="n">${d.getDate()}</div>
      ${evs.map(e=>`<button class="mi" data-ev="${esc(e.id)}"><span>★</span><span class="ef">${esc(e.title)}</span></button>`).join("")}
      ${list.slice(0,4).map(it=>`<button class="mi" data-id="${esc(it.id)}">${it.img?`<img src="${esc(it.img)}" alt="">`:`<span class="dot" style="--c:${esc(cColor(it.clientId))}"></span>`}<span>${esc((it.time?it.time+" ":"")+it.title)}</span></button>`).join("")}
      ${list.length>4?`<button class="more" data-week="${k}">+${list.length-4} más</button>`:""}</div>`;
  }
  html+=`</div>`;
  $("#view").innerHTML=html;
  $("#prev").onclick=()=>{S.month=new Date(m.getFullYear(),m.getMonth()-1,1);renderCal()};
  $("#next").onclick=()=>{S.month=new Date(m.getFullYear(),m.getMonth()+1,1);renderCal()};
  $("#tdy").onclick=()=>{S.month=firstOfMonth(new Date());renderCal()};
  $("#view").querySelectorAll(".mi[data-id]").forEach(b=>b.onclick=e=>{e.stopPropagation();openItem(items.find(x=>x.id===b.dataset.id))});
  $("#view").querySelectorAll(".mi[data-ev]").forEach(b=>b.onclick=e=>{e.stopPropagation();openEv(dates.find(x=>x.id===b.dataset.ev))});
  $("#view").querySelectorAll(".more").forEach(b=>b.onclick=e=>{e.stopPropagation();S.weekStart=monday(parse(b.dataset.week));S.calMode="semana";persist();renderCal()});
  $("#view").querySelectorAll(".mc").forEach(c=>c.onclick=()=>{S.weekStart=monday(parse(c.dataset.date));S.calMode="semana";persist();renderCal()});
}

function monthsBack(n){const out=[];const d=new Date();for(let i=0;i<n;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}return out}
function subMetricas(c){
  const months=monthsBack(6);
  const get=m=>metrics.find(x=>x.id===c.id+"_"+m)||{};
  const MF=[["seguidores","Seguidores"],["alcance","Alcance"],["interacciones","Interacciones"],["publicaciones","Publicaciones"]];
  const pts=months.slice().reverse().map(m=>({m,v:+get(m).seguidores||0}));
  const vals=pts.filter(p=>p.v);let chart='<div class="empty">Añade los seguidores de cada mes para ver la evolución</div>';
  if(vals.length>=1){
    const W=600,H=180,P=30,mn=Math.min(...vals.map(p=>p.v)),mx=Math.max(...vals.map(p=>p.v)),rg=Math.max(1,mx-mn);
    const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)/rg*(H-2*P);
    const line=pts.map((p,i)=>p.v?`${x(i)},${y(p.v)}`:null).filter(Boolean).join(" ");
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de seguidores">
      <polyline fill="none" stroke="${esc(c.color)}" stroke-width="3" points="${line}"/>
      ${pts.map((p,i)=>`${p.v?`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${esc(c.color)}"/><text x="${x(i)}" y="${y(p.v)-10}" font-size="12" text-anchor="middle" fill="currentColor">${p.v.toLocaleString("es-ES")}</text>`:""}<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="currentColor" opacity=".6">${fmtMs.format(parse(p.m+"-01"))}</text>`).join("")}</svg>`;
  }
  const tgt=+c.tSeguidores||0,cur=+get(months[0]).seguidores||+get(months[1]).seguidores||0;
  $("#sub").innerHTML=`${tgt?`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><b>${cur?cur.toLocaleString("es-ES"):"—"}</b><span>Seguidores ahora</span></div><div class="kpi"><b>${tgt.toLocaleString("es-ES")}</b><span>Objetivo</span></div><div class="kpi"><b>${cur?Math.min(100,Math.round(cur/tgt*100))+"%":"—"}</b><span>Conseguido</span></div></div>`:""}
    ${chart}
    <div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Mes</th>${MF.map(f=>`<th>${f[1]}</th>`).join("")}</tr></thead><tbody>
    ${months.map((m,i)=>{const r=get(m),p=get(months[i+1]||"");return `<tr><td style="white-space:nowrap;font-weight:600">${esc(cap(fmtM.format(parse(m+"-01")).replace(" de "," ")))}</td>${MF.map(([k])=>{const d=r[k]&&p[k]?r[k]-p[k]:null;return `<td><input type="number" min="0" data-m="${m}" data-f="${k}" value="${esc(r[k]??"")}" placeholder="—" ${canWrite?"":"readonly"}>${d!==null?`<span class="delta ${d>=0?"up":"down"}">${d>=0?"+":""}${d.toLocaleString("es-ES")}</span>`:""}</td>`}).join("")}</tr>`}).join("")}
    </tbody></table></div>
    <div class="saved"></div>
    <p class="sub" style="color:var(--muted);font-size:12px">Apunta los datos a final de cada mes desde las estadísticas de Instagram${c.metricool?" o desde Metricool":""}.</p>`;
  $("#sub").querySelectorAll("input[data-m]").forEach(inp=>inp.addEventListener("change",async()=>{
    const m=inp.dataset.m,f=inp.dataset.f,v=inp.value===""?null:Number(inp.value),id=c.id+"_"+m,cur=get(m);
    const data={clientId:c.id,month:m,seguidores:cur.seguidores??null,alcance:cur.alcance??null,interacciones:cur.interacciones??null,publicaciones:cur.publicaciones??null,[f]:v};
    const s=$("#sub .saved");s.textContent="Guardando…";
    try{await db.doc("metrics/"+id).set(data);s.textContent="Guardado ✓"}catch(e){s.textContent="No se pudo guardar"}
  }));
}

async function dlAsset(url,fallbackExt){
  if(!url)return;
  if(downloadsApi===undefined){try{downloadsApi=await claude.use("downloads")}catch(e){downloadsApi=null}}
  if(!downloadsApi){toast("Descarga no disponible aquí");return}
  toast("Preparando descarga…");
  try{
    const r=await fetch(url);if(!r.ok)throw new Error("fetch");const blob=await r.blob();
    const ext=((blob.type.split("/")[1]||fallbackExt).replace("jpeg","jpg").replace("quicktime","mov"));
    const base=(($("#fDate").value||"")+"-"+($("#fTitle").value||"contenido")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"contenido";
    await downloadsApi.save({filename:base+"."+ext,data:blob});
  }catch(e){if(e&&e.code!=="declined")toast("No se pudo descargar")}
}

  $("#view").querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{const p=profiles.find(x=>x.id===b.dataset.dm);navigator.clipboard.writeText(p.dm).then(()=>toast("Mensaje copiado: pégalo en su DM"),()=>toast("No se pudo copiar"))});
  $("#view").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openP(profiles.find(x=>x.id===b.dataset.edit)));
  $("#view").querySelectorAll("select[data-st]").forEach(sel=>sel.onchange=async()=>{try{await db.doc("profiles/"+sel.dataset.st).update({status:sel.value});toast("Estado actualizado")}catch(e){toast("No se pudo guardar")}});
}
function pCard(p){
  const h=(p.handle||"").replace(/^@/,""),n=daysSince(p.lastAt),done=p.lastAt===today();
  const last=n===null?"Nunca":n===0?"Hoy":n===1?"Ayer":`Hace ${n} días`;
  return `<div class="pc${done?" done":""}">
    <div class="hd"><span class="av" style="--c:${CATC[p.category]||"#888"}">${esc(initials(p.name||h))}</span><div style="min-width:0"><a href="https://www.instagram.com/${encodeURIComponent(h)}/" target="_blank" rel="noopener">@${esc(h)} ↗</a><small>${esc(p.name||"")}${p.zone?" · "+esc(p.zone):""}</small></div></div>
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    <div class="tags">${p.prio==="alta"?'<span class="tag" style="color:var(--danger)">Prioridad</span>':""}${p.verified===false?'<span class="tag warn">Revisar usuario</span>':""}${p.collab?'<span class="tag">Idea de colaboración</span>':""}${p.count?`<span class="tag">${p.count} interacciones</span>`:""}</div>
    ${p.collab?`<div class="note">💡 ${esc(p.collab)}</div>`:""}${p.notes?`<div class="note">${esc(p.notes)}</div>`:""}
    ${p.dm?`<details class="dm"><summary>Mensaje para enviar</summary><p>${esc(p.dm)}</p><button class="btn" data-dm="${esc(p.id)}">Copiar mensaje</button></details>`:""}
    <div class="row2">${canWrite?`<button class="btn${done?"":" primary"}" data-hit="${esc(p.id)}" ${done?"disabled":""}>${done?"✓ Hecho hoy":"✓ Interactué hoy"}</button>
      <select class="inp" data-st="${esc(p.id)}">${PSTAT.map(([k,l])=>`<option value="${k}"${p.status===k?" selected":""}>${l}</option>`).join("")}</select>
      <button class="btn ghost" data-edit="${esc(p.id)}">Editar</button>`:""}<span class="last">${last}</span></div>
  </div>`;
}
async function hitP(id){const p=profiles.find(x=>x.id===id);if(!p||!db)return;
  const data={lastAt:today(),count:(p.count||0)+1};if(p.status==="pendiente"||!p.status)data.status="interactuando";
  try{await db.doc("profiles/"+id).update(data);toast("¡Bien! "+(profiles.filter(x=>x.lastAt===today()).length+1)+" hoy")}catch(e){toast("No se pudo guardar")}}
let editingP=null;
function openP(p){if(!p&&!canWrite)return;editingP=p?p.id:null;
  $("#pCat").innerHTML=PCATS.map(c=>`<option>${esc(c)}</option>`).join("");
  $("#pStatus").innerHTML=PSTAT.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  $("#pClient").innerHTML=clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  const v=p||{clientId:S.sel!=="all"?S.sel:"racha",category:S.pCat!=="all"?S.pCat:PCATS[0],status:"pendiente",prio:"normal"};
  $("#pHandle").value=v.handle?"@"+v.handle.replace(/^@/,""):"";$("#pName").value=v.name||"";$("#pCat").value=v.category||"Otros";$("#pZone").value=v.zone||"";
  $("#pPrio").value=v.prio||"normal";$("#pClient").value=v.clientId||"";$("#pStatus").value=v.status||"pendiente";$("#pWhy").value=v.why||"";$("#pCollab").value=v.collab||"";$("#pNotes").value=v.notes||"";$("#pDm").value=v.dm||"";
  $("#pDel").hidden=!p||!canWrite;$("#formP").querySelectorAll("input,select,textarea").forEach(e=>e.disabled=!canWrite);
  $("#dlgP").showModal()}
$("#pCancel").onclick=()=>$("#dlgP").close();
$("#formP").addEventListener("submit",async e=>{e.preventDefault();if(!db||!canWrite)return;
  const data={handle:$("#pHandle").value.trim().replace(/^@/,""),name:$("#pName").value.trim(),category:$("#pCat").value,zone:$("#pZone").value.trim(),prio:$("#pPrio").value,
    clientId:$("#pClient").value,status:$("#pStatus").value,why:$("#pWhy").value.trim(),collab:$("#pCollab").value.trim(),notes:$("#pNotes").value.trim(),dm:$("#pDm").value.trim()};
  if(!data.handle)return;
  try{if(editingP)await db.doc("profiles/"+editingP).update(data);else await db.collection("profiles").add({...data,verified:true,count:0,lastAt:"",createdAt:new Date().toISOString()});$("#dlgP").close();toast("Guardado")}catch(err){toast("No se pudo guardar")}});
$("#pDel").onclick=async()=>{if(!editingP||!confirm("¿Borrar este perfil?"))return;try{await db.doc("profiles/"+editingP).delete();$("#dlgP").close()}catch(e){toast("No se pudo borrar")}};

/* ---------- event dialog ---------- */
function openEv(ev,preset={}){
  if(!ev&&!canWrite)return;
  editingEv=ev?ev.id:null;
  $("#eClient").innerHTML=`<option value="">Todas las cuentas</option>`+clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  const v=ev||{date:preset.date||"",type:"campaña",clientId:preset.clientId??(S.sel!=="all"?S.sel:"")};
  $("#eDate").value=v.date||"";$("#eType").value=v.type||"campaña";$("#eTitle").value=v.title||"";$("#eClient").value=v.clientId||"";$("#eNotes").value=v.notes||"";
  $("#eDel").hidden=!ev||!canWrite;
  $("#formEv").querySelectorAll("input,select,textarea").forEach(e=>e.disabled=!canWrite);
  $("#formEv").querySelector(".btn.primary").hidden=!canWrite;
  $("#dlgEv").showModal();
}
$("#eCancel").onclick=()=>$("#dlgEv").close();
$("#formEv").addEventListener("submit",async e=>{
  e.preventDefault();if(!db||!canWrite)return;
  const data={date:$("#eDate").value,type:$("#eType").value,title:$("#eTitle").value.trim(),clientId:$("#eClient").value,notes:$("#eNotes").value};
  try{if(editingEv)await db.doc("dates/"+editingEv).update(data);else await db.collection("dates").add(data);$("#dlgEv").close();toast("Guardado")}catch(err){toast("No se pudo guardar")}
});
$("#eDel").onclick=async()=>{if(!editingEv||!confirm("¿Borrar esta fecha?"))return;try{await db.doc("dates/"+editingEv).delete();$("#dlgEv").close()}catch(e){toast("No se pudo borrar")}};

/* ---------- data ---------- */
render();
(async()=>{
  db=await claude.use("db");
  if(!db){note("Abre esta página en claude.ai con tu sesión iniciada para ver y guardar el contenido.");return}
  const user=await claude.use("user");
  canWrite=user?(user.can("data.write")!==false):true;
  if(!canWrite)note("Modo lectura: puedes ver la planificación pero no editarla.");
  let pending=null;const later=()=>{if(pending)return;pending=requestAnimationFrame(()=>{pending=null;const a=document.activeElement;
    if(S.view==="cuentas"&&a&&a.closest&&a.closest("#sub")&&/INPUT|TEXTAREA/.test(a.tagName)){renderShell();return}
    render()})};
  const sub=(path,set,q)=>(q||db.collection(path)).onSnapshot(s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));later()},e=>note("Error cargando datos ("+(e.code||"")+")"));
  sub("clients",v=>clients=v,db.collection("clients").orderBy("order"));
  sub("items",v=>items=v);
  sub("metrics",v=>metrics=v);
  sub("dates",v=>dates=v);
  sub("templates",v=>templates=v);
  sub("profiles",v=>profiles=v);
  sub("events",v=>events=v);
  sub("tasks",v=>tasks=v);
  sub("links",v=>links=v);
  sub("gear",v=>gear=v);
})();
</script>
